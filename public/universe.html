<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Universe | D&amp;D Interactive Board</title>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--gold:#FFD700;--panel:rgba(12,12,12,.94)}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.universe-shell{height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.topbar{position:relative;z-index:20;display:flex;justify-content:space-between;gap:12px;padding:10px;background:var(--panel);border-bottom:1px solid #635b30}.nav-group,.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.gold-button,.controls button{padding:9px 12px;color:#111;background:var(--gold);border:1px solid var(--gold);border-radius:6px;font-weight:bold}.secondary{color:var(--gold)!important;background:#222!important}.danger{color:#fff!important;background:#9b2525!important;border-color:#c34b4b!important}.breadcrumbs{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.breadcrumbs button{padding:4px;color:var(--gold);background:none;border:0;text-decoration:underline}.viewport{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1f2930,#040506 72%)}#mapHost{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.world-canvas{width:100%;height:100%;touch-action:none}.azgaar-world-host{position:relative;width:100%;height:100%;background:#111}.azgaar-world-frame{display:block;width:100%;height:100%;border:0}.azgaar-marker-overlay{position:absolute;inset:0;z-index:4;pointer-events:none}.azgaar-marker-overlay.is-placing{pointer-events:auto;cursor:crosshair;background:rgba(255,215,0,.035)}.azgaar-location-marker{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;padding:5px 8px;color:#fff;background:#111;border:2px solid var(--gold);border-radius:12px;box-shadow:0 2px 7px #000;font-weight:bold}.azgaar-location-marker::after{position:absolute;left:50%;top:100%;width:8px;height:8px;content:'';background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}.generated-map{width:100%;height:100%;max-width:1400px;filter:drop-shadow(0 10px 35px #000)}.map-marker{cursor:pointer}.map-marker:focus{outline:none;filter:drop-shadow(0 0 5px var(--gold))}.info-panel{position:absolute;right:16px;bottom:16px;z-index:10;width:min(330px,calc(100% - 32px));padding:16px;background:var(--panel);border:1px solid var(--gold);border-radius:10px;box-shadow:0 8px 28px #000}.info-panel[hidden]{display:none}.info-panel h2{margin:0 0 7px;color:var(--gold);font-family:MedievalSharp,serif}.info-actions{display:flex;gap:8px;margin-top:12px}.status{position:absolute;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%);max-width:520px;padding:20px;text-align:center;background:var(--panel);border:1px solid #666;border-radius:10px}.status h2{color:var(--gold);font-family:MedievalSharp,serif}.status[hidden]{display:none}.placement-banner{position:absolute;left:50%;top:14px;z-index:9;transform:translateX(-50%);padding:10px 15px;color:#111;background:var(--gold);border-radius:7px;font-weight:bold}.placement-banner[hidden]{display:none}dialog{width:min(520px,calc(100% - 24px));padding:0;color:#fff;background:#181818;border:1px solid var(--gold);border-radius:10px;box-shadow:0 20px 70px #000}dialog::backdrop{background:rgba(0,0,0,.75)}.dialog-body{display:grid;gap:12px;padding:20px}.dialog-body h2{margin:0;color:var(--gold);font-family:MedievalSharp,serif}.dialog-body label{display:grid;gap:5px;color:var(--gold);font-weight:bold}.dialog-body input,.dialog-body select,.dialog-body textarea{width:100%;padding:9px;color:#fff;background:#292929;border:1px solid #666;border-radius:5px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(max-width:850px){.topbar{align-items:flex-start;flex-direction:column}.controls{width:100%;overflow-x:auto;flex-wrap:nowrap}.controls button{white-space:nowrap}.info-panel{right:8px;bottom:8px;width:calc(100% - 16px)}.breadcrumbs{font-size:.86rem}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
  </style>
</head>
<body>
  <main class="universe-shell">
    <header class="topbar">
      <div class="nav-group"><button id="backButton" class="gold-button" type="button">← Back</button><nav id="breadcrumbs" class="breadcrumbs" aria-label="Map hierarchy"></nav></div>
      <div id="dmControls" class="controls" hidden><button id="newWorldButton" type="button">New World</button><button id="addLocationButton" type="button">Add Location</button><button id="regenerateButton" type="button">Regenerate</button><button id="renameButton" type="button">Rename</button><button id="settingsButton" type="button">Generator Settings</button><button id="deleteButton" class="danger" type="button">Delete</button></div>
    </header>
    <section class="viewport" aria-label="Universe map viewport">
      <div id="mapHost"></div>
      <div id="placementBanner" class="placement-banner" hidden>Click a location on the map · Escape to cancel</div>
      <section id="statusPanel" class="status" role="status"><h2>Loading Universe…</h2><p>Authenticating and loading map descriptors.</p></section>
      <aside id="infoPanel" class="info-panel" hidden><h2 id="infoName"></h2><div id="infoType"></div><p id="infoDescription"></p><div class="info-actions"><button id="openMarkerButton" class="gold-button" type="button">Enter / Open</button><button id="editMarkerButton" class="gold-button secondary" type="button">Edit</button></div></aside>
    </section>
  </main>

  <dialog id="mapDialog"><form id="mapForm" class="dialog-body" method="dialog"><h2 id="dialogTitle">Create Map</h2><input id="editingMapId" type="hidden"><label>Name<input id="mapName" maxlength="80" required></label><label>Location Type<select id="mapType"><option value="world">World</option><option value="town">Town</option><option value="dungeon">Dungeon</option><option value="dwelling">Dwelling</option><option value="cave">Cave</option><option value="glade">Glade</option><option value="wilderness">Wilderness</option><option value="other">Other</option></select></label><label>Generator<select id="mapProvider"><option value="azgaar">Azgaar Fantasy Map Generator</option><option value="azgaar-compatible" hidden>Legacy World Generator</option><option value="azgaar-town" hidden>Azgaar Generated Town</option><option value="town">Local Vector Town</option><option value="watabou-dungeon">Watabou One Page Dungeon</option><option value="watabou-dwelling">Watabou Dwelling</option><option value="watabou-cave">Watabou Cave</option><option value="watabou-glade">Watabou Glade</option><option value="rot-dungeon">Local Vector Dungeon</option><option value="wilderness">Procedural Wilderness</option></select></label><label>Deterministic Seed<input id="mapSeed" maxlength="100" required></label><label>Short Description<textarea id="mapDescription" maxlength="500" rows="3"></textarea></label><label>Generator Parameters (JSON)<textarea id="mapParams" rows="5">{}</textarea></label><label>Optional Generator Permalink<input id="mapPermalink" type="url" maxlength="500"></label><div id="formError" role="alert" style="color:#ff7878"></div><div class="dialog-actions"><button id="cancelDialog" class="gold-button secondary" type="button">Cancel</button><button class="gold-button" value="save" type="submit">Save</button></div></form></dialog>

  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script type="module" src="universe.js?v=14"></script>
</body>
</html>
