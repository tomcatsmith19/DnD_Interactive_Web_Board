<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu</title>
  <!-- Fantasy Font -->
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: url("data/images/tavern.png") no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f4d76d;
    }

    .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 30px;
      max-width: calc(100vw - 64px);
      max-height: 94vh;
      overflow: auto;
      padding: 24px;
      background: rgba(29, 16, 9, 0.88);
      border: 2px ridge #d4af37;
      border-radius: 16px;
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.12), 0 12px 36px rgba(0, 0, 0, 0.55);
    }

    .menu-image {
     width: 200px;
     height: 200px;
     object-fit: contain;
     border: 4px ridge #d4af37;
     border-radius: 10px; /* Rounded corners */
     padding: 5px; /* Little padding inside the border */
     background-color: rgba(43, 25, 15, 0.85);
     box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.16), 0 5px 14px rgba(0, 0, 0, 0.45);
    }

    .menu-button {
      width: 220px;
      padding: 20px;
      font-family: 'MedievalSharp', cursive;
      font-size: 2.5rem;
      background: linear-gradient(#4b2915, #1d1009);
      color: #f4d76d;
      border: 2px ridge #d4af37;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .menu-button:hover {
      background: linear-gradient(#684126, #3d2718);
      color: #fff3c4;
      border-color: #f4d76d;
      box-shadow: 0 0 10px rgba(244, 215, 109, 0.28);
      transform: scale(1.05);
    }

    .menu-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    @media (max-width: 820px) {
      html, body {
        align-items: flex-start;
      }

      .container {
        flex-direction: column;
        margin: 20px 0;
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="menu-option">
      <img src="data/images/dm.png" alt="Dungeon Master" class="menu-image">
      <button class="menu-button" onclick="sessionStorage.setItem('vttRole','dm');location.href='dm.html'">DM</button>
    </div>

    <div class="menu-option">
      <img src="data/images/players.png" alt="Player" class="menu-image">
      <button class="menu-button" onclick="sessionStorage.setItem('vttRole','player');location.href='player.html'">Player</button>
    </div>

    <div class="menu-option">
      <img src="data/images/universe.png" alt="Universe" class="menu-image">
      <button class="menu-button" onclick="location.href='universe.html'">Universe <span style="display:block;font-family:Arial,sans-serif;font-size:.8rem;">(in development)</span></button>
    </div>
  </div>
</body>
</html>
