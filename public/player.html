<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Viewer</title>
  <!-- Fantasy Font -->
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    body {
      background-color: #121212;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
    }

    .monster-token.is-defeated img { filter: grayscale(1) brightness(.42); }
    .defeated-token-x { display: none; position: absolute; inset: 0; z-index: 18; align-items: center; justify-content: center; color: #e00000; font-family: Arial, sans-serif; font-weight: 900; line-height: 1; text-shadow: 0 0 4px #000, 2px 2px 0 #330000; pointer-events: none; }
    .monster-token.is-defeated .defeated-token-x { display: flex; }
    .monster-token.is-selected { border-color: #4fc3ff !important; box-shadow: 0 0 0 3px rgba(79,195,255,.8), 0 0 18px #4fc3ff; }
    .token-health-bar { position:absolute; left:0; bottom:-8px; width:100%; height:7px; overflow:hidden; background:#3b1111; border:1px solid #111; border-radius:4px; box-sizing:border-box; pointer-events:none; }
    .token-health-fill { height:100%; width:100%; background:#2ecc40; transition:width .25s ease, background-color .25s ease; }
    .map-action-panel { display:none; position:fixed; z-index:2200; top:80px; right:20px; width:280px; padding:14px; background:rgba(20,20,20,.97); border:2px solid #4fc3ff; border-radius:9px; box-shadow:0 8px 30px #000; color:white; }
    .map-action-panel.is-open { display:block; }
    .map-action-panel h3 { margin:0 0 4px; color:#FFD700; }
    .map-action-panel select, .map-action-panel input, .map-action-panel button { width:100%; box-sizing:border-box; margin-top:8px; padding:9px; background:#333; color:white; border:1px solid #666; border-radius:5px; }
    .map-action-panel button { background:#32CD32; color:#111; border:0; font-weight:bold; cursor:pointer; }
    .map-action-panel .map-action-close { position:absolute; top:4px; right:7px; width:auto; margin:0; padding:3px 7px; background:transparent; color:#bbb; }
    .token-lasso { position:absolute; inset:0; z-index:30; width:100%; height:100%; pointer-events:none; overflow:visible; }
    .token-lasso polyline { fill:rgba(79,195,255,.16); stroke:#4fc3ff; stroke-width:3; stroke-dasharray:9 6; stroke-linejoin:round; }
    .combat-flash-effect { position:fixed; z-index:2900; border-radius:50%; pointer-events:none; }
    .combat-flash-effect.flash-red { animation:flash-red 1s ease-out forwards; }
    .combat-flash-effect.flash-green { animation:flash-green 1s ease-out forwards; }
    .token-death-effect { position:fixed; z-index:3000; width:72px; height:72px; object-fit:contain; pointer-events:none; animation:token-death-float 1.6s ease-out forwards; }
    #menu, #toggleMenuStandalone { display:none !important; }
    .party-panel { position:fixed; top:70px; left:20px; z-index:1100; width:390px; max-height:55vh; overflow:visible; padding:12px; color:white; background:rgba(15,15,15,.92); border:1px solid #666; border-radius:9px; transition:transform .25s ease; }
    .party-panel.is-collapsed { transform:translateX(calc(-100% - 20px)); }
    .party-panel-content { max-height:50vh; overflow:auto; }
    .party-collapse { position:absolute; top:50%; right:-29px; transform:translateY(-50%); width:29px; height:105px; padding:0 !important; border-radius:0 7px 7px 0 !important; writing-mode:horizontal-tb; background:#111 !important; color:#FFD700; border:1px solid #FFD700 !important; }
    .party-panel h2 { margin:0 0 8px; color:#FFD700; font-family:'MedievalSharp',cursive; }
    .party-table { width:100%; border-collapse:collapse; font-size:.85rem; }
    .party-table th,.party-table td { padding:5px; border:1px solid #555; }
    .party-table input { width:58px; box-sizing:border-box; background:#292929; color:white; border:1px solid #666; }
    .party-panel button,.party-modal button { padding:8px; background:#FFD700; border:0; border-radius:5px; font-weight:bold; cursor:pointer; }
    .audio-dock { position:fixed; left:12px; right:12px; bottom:12px; z-index:1150; display:flex; align-items:flex-start; gap:10px; padding:8px; color:white; background:rgba(15,15,15,.92); border:1px solid #666; border-radius:9px; }
    .audio-dock.is-collapsed .audio-dock-content { display:none; }
    .audio-dock.is-collapsed { height:0; padding:0; border:0; bottom:0; }
    .audio-dock-content { display:grid; grid-template-columns:minmax(105px,.4fr) repeat(3,minmax(0,1fr)); gap:8px 12px; align-items:start; flex:1; }
    .audio-music-controls { display:flex; flex-direction:column; align-items:stretch; gap:8px; }
    .audio-music-controls::before { content:'Background Music'; color:#FFD700; font-weight:bold; font-size:.78rem; text-align:center; }
    .audio-controls { display:flex; flex-direction:column; gap:7px; font-size:.72rem; color:#FFD700; }
    .audio-controls input[type="range"] { accent-color:#FFD700; }
    #dockMusicSelect { padding:6px 9px; background:#111; color:#FFD700; border:1px solid #FFD700; border-radius:4px; }
    .audio-group { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:center; gap:5px; }
    .audio-group strong { grid-column:1/-1; color:#FFD700; font-size:.78rem; text-align:center; }
    .audio-group button { padding:6px 9px; font-size:.76rem; background:#111; color:#FFD700; border:1px solid #FFD700; border-radius:4px; cursor:pointer; }
    .audio-group button:hover { background:#FFD700; color:#111; }
    .audio-group + .audio-group { border-left:1px solid rgba(255,215,0,.55); padding-left:12px; }
    .audio-group.reactions button { color:#55d66b; border-color:#55d66b; }
    .audio-group.reactions button:hover { color:#081b0c; background:#55d66b; }
    .audio-group.combat button { color:#ff5959; border-color:#ff5959; }
    .audio-group.combat button:hover { color:#210606; background:#ff5959; }
    .audio-group.checks button { color:#55a8ff; border-color:#55a8ff; }
    .audio-group.checks button:hover { color:#06172a; background:#55a8ff; }
    .audio-collapse-tab { position:absolute; top:-24px; left:50%; transform:translateX(-50%); width:110px; height:24px; padding:0; background:#111; color:#FFD700; border:1px solid #FFD700; border-bottom:0; border-radius:7px 7px 0 0; cursor:pointer; }
    .party-modal { display:none; position:fixed; inset:0; z-index:3500; align-items:center; justify-content:center; background:rgba(0,0,0,.8); }
    .party-modal.is-open { display:flex; }
    .party-modal-card { width:min(620px,90vw); max-height:80vh; overflow:auto; padding:18px; background:#222; color:white; border-radius:10px; }
    .party-choice-list { max-height:55vh; overflow:auto; margin:10px 0; }
    .party-choice { display:flex; justify-content:space-between; width:100%; margin:3px 0; color:white; background:#333 !important; }
    @keyframes token-death-float { 0%{transform:translate(-50%,0) scale(.65);opacity:0} 18%{transform:translate(-50%,-12px) scale(1.1);opacity:1} 100%{transform:translate(-50%,-130px) scale(.85);opacity:0} }

    #menu {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      color: white;
      transition: width 0.3s ease, opacity 0.3s ease;
      overflow-y: auto;
    }

    #menu.fullscreen {
      width: 100%;
      padding: 0;
    }

    #menu.third {
      width: 33.33%;
      padding: 20px;
    }

    #toggleMenu {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #FFD700;
      border: none;
      color: black;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 1000;
    }

    #toggleMenuStandalone {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: #FFD700;
      border: none;
      color: black;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.4rem;
      z-index: 2000;
      display: none;
    }

    #menuContent {
      margin-top: 50px;
    }

    @keyframes flash-red {
      0% {
        box-shadow: 0 0 0px red;
      }

      50% {
        box-shadow: 0 0 40px 20px red;
      }

      100% {
        box-shadow: 0 0 0px red;
      }
    }

    @keyframes flash-green {
      0% {
        box-shadow: 0 0 0px limegreen;
      }

      50% {
        box-shadow: 0 0 40px 20px limegreen;
      }

      100% {
        box-shadow: 0 0 0px limegreen;
      }
    }

    .flash-red {
      animation: flash-red 1s ease-out;
    }

    .flash-green {
      animation: flash-green 1s ease-out;
    }

    .sound-button {
      padding: 10px;
      background-color: #444;
      color: #FFD700;
      border: 1px solid #FFD700;
      border-radius: 5px;
      font-family: 'MedievalSharp', cursive;
      font-size: 1rem;
      cursor: pointer;
    }

    .sound-button:hover {
      background-color: #666;
    }

    .sound-category {
      color: #FFD700;
      font-family: 'MedievalSharp', cursive;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <!-- Scrollable Map Wrapper -->
  <div id="scrollWrapper" style="position: fixed; inset: 0; overflow: auto; z-index: 0;">
    <div id="mapContainer" style="position: relative; display: inline-block;">
      <div id="mapTransformLayer" style="transform-origin: top left; position: relative;">
        <img id="mapImage" src="data/maps/blank.jpg" alt="Map Image" style="width: 100%; height: auto; display: block;">
        <div id="mapTokenLayer"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
        <svg id="tokenLasso" class="token-lasso" style="display:none;"><polyline id="tokenLassoPath" points=""></polyline></svg>
      </div>
    </div>

    <div id="mapActionPanel" class="map-action-panel" role="dialog" aria-label="Token actions">
      <button class="map-action-close" type="button" onclick="clearMapTokenSelection()" aria-label="Close">×</button>
      <h3>Token Actions</h3>
      <div id="mapActionTargets">No tokens selected</div>
      <select id="mapActionType" onchange="updateMapActionFields()"><option value="damage">Damage</option><option value="heal">Heal</option><option value="apply">Apply Condition</option><option value="remove">Remove Condition</option><option value="removeCreature">Remove Creature</option></select>
      <div id="mapActionAmountGroup"><input id="mapActionAmount" type="number" min="0" value="0" placeholder="Amount"></div>
      <div id="mapActionConditionGroup" style="display:none;"><select id="mapActionCondition"><option>Blinded</option><option>Charmed</option><option>Deafened</option><option>Frightened</option><option>Grappled</option><option>Incapacitated</option><option>Invisible</option><option>Paralyzed</option><option>Petrified</option><option>Poisoned</option><option>Prone</option><option>Restrained</option><option>Stunned</option><option>Unconscious</option><option>Exhaustion</option><option>Hexed</option><option>Blessed</option><option>Baned</option><option>mark1</option><option>mark2</option><option>mark3</option></select></div>
      <button type="button" onclick="applyMapTokenAction()">Apply to Selected</button>
    </div>

    <!-- Token Size Controls -->
    <div id="tokenSizeControls" style="
                    position: fixed;
                    top: 25px;
                    left: 25px;
                    background-color: rgba(0, 0, 0, 0.7);
                    padding: 8px 12px;
                    border-radius: 8px;
                    z-index: 1000;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    color: white;
                    font-family: 'MedievalSharp', cursive;
                ">
      <span>Token Size</span>
      <button id="decreaseTokenSize" style="font-size: 18px;">-</button>
      <button id="increaseTokenSize" style="font-size: 18px;">+</button>
    </div>
  </div>

  <aside id="partyPanel" class="party-panel is-collapsed">
    <button id="partyCollapseButton" class="party-collapse" type="button" onclick="togglePartyPanel()">›</button>
    <div class="party-panel-content"><h2>Party</h2>
    <table class="party-table"><thead><tr><th>Name</th><th>Init</th><th>HP</th><th>Max HP</th></tr></thead><tbody id="partyTableBody"></tbody></table>
    <button type="button" style="width:100%;margin-top:8px;" onclick="openPartyPicker()">Add to Party</button>
    <div style="display:flex;gap:6px;margin-top:6px;"><button type="button" style="flex:1;background:#1976d2;color:white;" onclick="document.getElementById('menuBtn').click()">Menu</button><button type="button" style="flex:1;background:#b33;color:white;" onclick="document.getElementById('logoutBtn').click()">Logout</button></div></div>
  </aside>

  <div id="partyPicker" class="party-modal"><div class="party-modal-card"><h2>Add to Party</h2><input id="partySearch" type="search" placeholder="Search monsters or player characters" style="width:100%;padding:9px;"><div id="partyChoiceList" class="party-choice-list"></div><button type="button" onclick="closePartyPicker()">Close</button></div></div>

  <section id="audioDock" class="audio-dock is-collapsed">
    <button id="audioCollapseButton" class="audio-collapse-tab" type="button" onclick="toggleAudioDock()">⌃</button>
    <div class="audio-dock-content">
      <div class="audio-music-controls"><select id="dockMusicSelect" onchange="handleDockMusicChange(this.value)"><option value="">No Music</option><option value="data/music/camp.mp3">Camp</option><option value="data/music/tavern.mp3">Tavern</option><option value="data/music/city.mp3">City</option><option value="data/music/desert.mp3">Desert</option><option value="data/music/swamp.mp3">Swamp</option><option value="data/music/forest.mp3">Forest</option><option value="data/music/mountain.mp3">Mountain</option><option value="data/music/underdark.mp3">Underdark</option><option value="data/music/dungeon.mp3">Dungeon</option><option value="data/music/combat.mp3">Combat</option></select>
      <div class="audio-controls"><label>Music <input id="musicVolume" type="range" min="0" max="1" step="0.05" value="1" oninput="setMusicVolume(this.value)"></label><label>SFX <input id="sfxVolume" type="range" min="0" max="1" step="0.05" value="1" oninput="setSfxVolume(this.value)"></label></div></div>
      <div class="audio-group reactions"><strong>Reactions</strong><button onclick="playSoundEffect('data/sounds/angry.mp3')">Angry</button><button onclick="playSoundEffect('data/sounds/bruh.mp3')">Bruh</button><button onclick="playSoundEffect('data/sounds/dumb.mp3')">Dumb</button><button onclick="playSoundEffect('data/sounds/evillaugh.mp3')">Evil Laugh</button><button onclick="playSoundEffect('data/sounds/scream.mp3')">Scream</button><button onclick="playSoundEffect('data/sounds/nooo.mp3')">Nooo</button><button onclick="playSoundEffect('data/sounds/suprise.mp3')">Surprise</button><button onclick="playSoundEffect('data/sounds/oh_my.mp3')">Oh My</button><button onclick="playSoundEffect('data/sounds/awww.mp3')">Awww</button><button onclick="playSoundEffect('data/sounds/laugh.mp3')">Laugh</button></div>
      <div class="audio-group combat"><strong>Combat</strong><button onclick="playSoundEffect('data/sounds/yeet.mp3')">Yeet</button><button onclick="playSoundEffect('data/sounds/running.mp3')">Run</button><button onclick="playSoundEffect('data/sounds/bite.mp3')">Bite</button><button onclick="playSoundEffect('data/sounds/punch.mp3')">Punch</button><button onclick="playSoundEffect('data/sounds/splat.mp3')">Splat</button><button onclick="playSoundEffect('data/sounds/bonk.mp3')">Bonk</button><button onclick="playSoundEffect('data/sounds/hammer.mp3')">Hammer</button><button onclick="playSoundEffect('data/sounds/sword.mp3')">Sword</button><button onclick="playSoundEffect('data/sounds/tentacle.mp3')">Tentacle</button><button onclick="playSoundEffect('data/sounds/gunshot.mp3')">Gun</button><button onclick="playSoundEffect('data/sounds/Explosion.mp3')">Blast</button><button onclick="playSoundEffect('data/sounds/failed_spell.mp3')">Spell Fail</button><button onclick="playSoundEffect('data/sounds/spell attack.mp3')">Spell</button></div>
      <div class="audio-group checks"><strong>Checks</strong><button onclick="playSoundEffect('data/sounds/died.mp3')">Died</button><button onclick="playSoundEffect('data/sounds/item.mp3')">Item</button><button onclick="playSoundEffect('data/sounds/sad.mp3')">Fail</button><button onclick="playSoundEffect('data/sounds/senses.mp3')">Senses</button><button onclick="playSoundEffect('data/sounds/slipandfall.mp3')">Fall</button><button onclick="playSoundEffect('data/sounds/sucess.mp3')">Success</button><button onclick="playSoundEffect('data/sounds/spell_whispers.mp3')">Whispers</button></div>
    </div>
  </section>

  <!-- Menu -->
  <div id="menu" class="fullscreen">
    <button id="toggleMenu">⇨</button>
    <div id="menuContent">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">


        <!-- Player Stats Container -->
        <div
          style="width: 90%; background-color: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin-bottom: 20px;">
          <h1 style="font-family: 'MedievalSharp', cursive; font-size: 2rem; text-align: center;">Player Name</h1>

          <label for="playerSelect">Choose Player:</label>
          <select id="playerSelect"
            style="width: 100%; padding: 8px; margin-bottom: 10px; background-color: #333; color: #fff;">
            <option value="Alben Ravenwood">Alben Ravenwood</option>
            <option value="hatman">hatman</option>
            <option value="Sera Nobody">Sera Nobody</option>
            <option value="Anastrianna">Anastrianna</option>
            <option value="Cowdissius">Cowdissius</option>
            <option value="Neuromaur">Neuromaur</option>
            <option value="Null">Null</option>
            <option value="Prayer">Prayer</option>
            <option value="Seraphina">Seraphina</option>
            <option value="Telperil">Telperil</option>
            <!-- Add more as needed -->
          </select>

          <label for="initiativeInput">Initiative:</label>
          <input type="number" id="initiativeInput" min="0" value="0"
            style="width: 100%; padding: 8px; margin-bottom: 10px; background-color: #333; color: #fff; border: 1px solid #555; border-radius: 5px;">

          <label>HP:</label>
          <input type="number" id="currentHP" value="10"
            style="width: 100%; padding: 8px; background-color: #333; color: #fff; border: 1px solid #555; border-radius: 5px;">
        </div>

        <!-- Action Container -->
        <div style="width: 90%; background-color: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px;">
          <h1 style="font-family: 'MedievalSharp', cursive; font-size: 2rem; text-align: center;">Action Interface</h1>

          <label for="actionSelect">Action:</label>
          <select id="actionSelect"
            style="width: 100%; padding: 8px; margin-bottom: 10px; background-color: #333; color: #fff;">
            <option value="heal">Heal</option>
            <option value="damage">Damage</option>
            <option value="apply">Apply Condition</option>
            <option value="remove">Remove Condition</option>
          </select>

          <label for="targetIndex">Target Index:</label>
          <input type="number" id="targetIndex" min="0" value="0"
            style="width: 100%; padding: 8px; margin-bottom: 10px; background-color: #333; color: #fff;">

          <label for="conditionSelect">Condition (if applicable):</label>
          <select id="conditionSelect"
            style="width: 100%; padding: 8px; margin-bottom: 10px; background-color: #333; color: #fff;">
            <option>-- None --</option>
            <option>Blinded</option>
            <option>Charmed</option>
            <option>Deafened</option>
            <option>Frightened</option>
            <option>Grappled</option>
            <option>Incapacitated</option>
            <option>Invisible</option>
            <option>Paralyzed</option>
            <option>Petrified</option>
            <option>Poisoned</option>
            <option>Prone</option>
            <option>Restrained</option>
            <option>Stunned</option>
            <option>Unconscious</option>
            <option>Exhaustion</option>
            <option>Hexed</option>
            <option>Blessed</option>
            <option>Baned</option>
            <option>mark1</option>
            <option>mark2</option>
            <option>mark3</option>
          </select>

          <label for="amountTurns">Amount / Turns:</label>
          <input type="number" id="amountTurns" min="0" value="0"
            style="width: 100%; padding: 8px; margin-bottom: 20px;  background-color: #333; color: #fff;">

          <button id="executeBtn"
            style="width: 100%; padding: 10px; font-family: 'MedievalSharp', cursive; font-size: 1.2rem; background-color: #32CD32; color: white; border: none; border-radius: 5px; cursor: pointer;">Execute</button>
        </div>

        <!-- Sound Effects & Background Music Container -->
        <div style="width: 90%; background-color: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px;">
          <h1 style="font-family: 'MedievalSharp', cursive; font-size: 2rem; text-align: center;">Audio Interface</h1>

          <!-- Background Music Selector -->
          <label for="bgMusicSelect">Background Music:</label>
          <select id="bgMusicSelect" onchange="handleMusicChange()"
            style="width: 100%; padding: 8px; margin-bottom: 20px; background-color: #333; color: #fff;">

            <option value="">No Music</option>

            <optgroup label="Civilization">
              <option value="data/music/camp.mp3">Camp</option>
              <option value="data/music/tavern.mp3">Tavern</option>
              <option value="data/music/city.mp3">City</option>
            </optgroup>

            <optgroup label="Environments">
              <option value="data/music/desert.mp3">Desert</option>
              <option value="data/music/swamp.mp3">Swamp</option>
              <option value="data/music/forest.mp3">Forest</option>
              <option value="data/music/mountain.mp3">Mountain</option>
              <option value="data/music/underdark.mp3">Underdark</option>
              <option value="data/music/far relm.mp3">Far Realm</option>
            </optgroup>

            <optgroup label="Adventuring">
              <option value="data/music/dungeon.mp3">Dungeon</option>
              <option value="data/music/combat.mp3">Combat</option>
            </optgroup>


          </select>

          <!-- Sound Effects Grid with Categories -->
          <div style="display: flex; flex-direction: column; gap: 20px;">

            <!-- Reactions -->
            <div>
              <h3 class="sound-category">Reactions</h3>
              <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                <button class="sound-button" onclick="playSoundEffect('data/sounds/angry.mp3')">Angry</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/bruh.mp3')">Bruh</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/dumb.mp3')">Dumb</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/evillaugh.mp3')">Evil Laugh</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/scream.mp3')">Scream</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/nooo.mp3')">Noooo</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/suprise.mp3')">Surprise</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/oh_my.mp3')">Oh My</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/awww.mp3')">Awww</button>
                <button class="sound-button" onclick="playSoundEffect('data/sounds/laugh.mp3')">Laugh</button>

              </div>
            </div>

            <!-- Combat -->
            <div>
              <h3 class="sound-category">Combat</h3>
              <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDeUJ3781n8fi4QhVWvHAfeW7ueRqaw87E",
      authDomain: "dnd-interactive-web-board.firebaseapp.com",
      projectId: "dnd-interactive-web-board",
      storageBucket: "dnd-interactive-web-board.firebasestorage.app",
      messagingSenderId: "474147936717",
      appId: "1:474147936717:web:5a4101401f5bde9a368c84",
      measurementId: "G-G9KT6WQ5F4"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let sessionOwnerId = '';

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      sessionOwnerId = user.uid;
      // Setup logout button after login
      const logoutBtn = document.getElementById("logoutBtn");
      logoutBtn.addEventListener("click", () => {
        cleanupSessionParty().finally(() => auth.signOut()).then(() => {
          window.location.href = "index.html";
        });

    });

    const menuBtn = document.getElementById("menuBtn");
    menuBtn.addEventListener("click", () => {
      window.location.href = "menu.html";
    });

    // Menu Logic
    const menu = document.getElementById("menu");
    const toggleBtn = document.getElementById("toggleMenu");
    const toggleBtnStandalone = document.getElementById("toggleMenuStandalone");

    let menuState = "fullscreen"; // 'fullscreen', 'third', 'hidden'

    const setMenuState = (state) => {
      menu.classList.remove("fullscreen", "third");
      menu.style.display = (state === "hidden") ? "none" : "block";
      toggleBtnStandalone.style.display = (state === "hidden") ? "block" : "none";

      if (state === "fullscreen") {
        menu.classList.add("fullscreen");
      } else if (state === "third") {
        menu.classList.add("third");
      }

      menuState = state;
    };

    const cycleMenuState = () => {
      if (menuState === "fullscreen") {
        setMenuState("third");
      } else if (menuState === "third") {
        setMenuState("hidden");
      } else if (menuState === "hidden") {
        setMenuState("fullscreen");
      }
    };

    toggleBtn.addEventListener("click", cycleMenuState);
    toggleBtnStandalone.addEventListener("click", cycleMenuState);


    // Global monster state array
    const monsters = []; // Each: { id, name, hp, init, conditions, x, y, isplayer }
    const tokenLayer = document.getElementById('mapTokenLayer');
    const mapImage = document.getElementById('mapImage');
    const selectedMapTokenIds = new Set();
    let partyCatalog = [];

    function updatePlayerTokenInitiativeLabels() {
      const ordered = [...monsters].sort((a,b)=>(Number(b.init)||0)-(Number(a.init)||0));
      ordered.filter(monster=>monster.hp>0||monster.isplayer).forEach((monster,index)=>{
        const label=document.querySelector(`#token-${CSS.escape(monster.id)} .token-label`);
        if(label)label.textContent=index;
      });
      ordered.filter(monster=>monster.hp<=0&&!monster.isplayer).forEach(monster=>{
        const label=document.querySelector(`#token-${CSS.escape(monster.id)} .token-label`);
        if(label)label.textContent='×';
      });
    }

    function renderPartyTracker() {
      const body=document.getElementById('partyTableBody'); if(!body)return; body.replaceChildren();
      monsters.filter(monster=>monster.partyManaged&&monster.partyOwner===sessionOwnerId).forEach(monster=>{
        const row=body.insertRow(),nameCell=row.insertCell(),removeButton=document.createElement('button');removeButton.type='button';removeButton.textContent='×';removeButton.title='Remove from party';removeButton.style.cssText='margin-right:5px;padding:1px 5px;background:#c62828;color:white;';removeButton.addEventListener('click',()=>removeCreatureById(monster.id));nameCell.appendChild(removeButton);nameCell.appendChild(document.createTextNode(monster.name));
        ['init','hp','maxHp'].forEach(field=>{const cell=row.insertCell(),input=document.createElement('input');input.type='number';input.value=monster[field]??0;input.addEventListener('change',()=>{monster[field]=Number(input.value)||0;if(field==='maxHp')monster.maxHp=Math.max(1,monster.maxHp);if(field==='hp'&&!monster.isplayer)monster.hp=Math.max(0,monster.hp);updateTokenHealthBar(monster);updateTokenDefeatedState(monster);updatePlayerTokenInitiativeLabels();syncMonstersToFirebase();});cell.appendChild(input);});
      });
    }

    function renderPartyChoices(filter='') {const list=document.getElementById('partyChoiceList');list.replaceChildren();partyCatalog.filter(item=>item.name.toLowerCase().includes(filter.toLowerCase())).forEach(item=>{const button=document.createElement('button');button.className='party-choice';button.type='button';button.textContent=`${item.name} — ${item.kind}`;button.addEventListener('click',()=>addPartyMember(item));list.appendChild(button);});}
    function togglePartyPanel(){const panel=document.getElementById('partyPanel'),button=document.getElementById('partyCollapseButton');panel.classList.toggle('is-collapsed');button.textContent=panel.classList.contains('is-collapsed')?'›':'‹';}
    function toggleAudioDock(){const dock=document.getElementById('audioDock'),button=document.getElementById('audioCollapseButton');dock.classList.toggle('is-collapsed');button.textContent=dock.classList.contains('is-collapsed')?'⌃':'⌄';}
    function openPartyPicker(){document.getElementById('partyPicker').classList.add('is-open');renderPartyChoices(document.getElementById('partySearch').value);}
    function closePartyPicker(){document.getElementById('partyPicker').classList.remove('is-open');}
    async function addPartyMember(choice){let member;if(choice.kind==='Player')member={id:generateID(),name:choice.name,hp:10,maxHp:10,init:0,conditions:[],xRatio:.5,yRatio:.5,isplayer:true};else{const response=await fetch(`data/monsters/${encodeURIComponent(choice.name)}.json`);if(!response.ok){alert(`Could not load ${choice.name}`);return;}const data=await response.json(),hp=typeof data.hp==='object'?data.hp.average:data.hp;member={id:generateID(),name:data.name,hp:Number(hp)||1,maxHp:Number(hp)||1,init:Math.floor(Math.random()*20)+1,conditions:[],xRatio:.5,yRatio:.5,isplayer:false,tokenUrl:`data/monster_tokens/${encodeURIComponent(data.name)}.webp`};}member.partyManaged=true;member.partyOwner=sessionOwnerId;monsters.push(member);addMonsterToken(member);updatePlayerTokenInitiativeLabels();renderPartyTracker();syncMonstersToFirebase();closePartyPicker();}
    function cleanupSessionParty(){if(!sessionOwnerId)return Promise.resolve();for(let i=monsters.length-1;i>=0;i--)if(monsters[i].partyManaged&&monsters[i].partyOwner===sessionOwnerId)monsters.splice(i,1);renderPartyTracker();return Promise.resolve(syncMonstersToFirebase());}
    document.getElementById('partySearch')?.addEventListener('input',event=>renderPartyChoices(event.target.value));
    const playerCharacterNames=[...document.querySelectorAll('#playerSelect option')].map(option=>option.value).filter(Boolean);
    fetch('data/api_data/monster_catalog.json').then(response=>response.json()).then(data=>{partyCatalog=[...playerCharacterNames.map(name=>({name,kind:'Player'})),...data.map(monster=>({name:monster.name,kind:'Monster'}))];});
    window.addEventListener('pagehide',()=>cleanupSessionParty());

    function normalizeMonsterState(monster) {
      const hp = Number(monster.hp) || 0;
      return { ...monster, hp, maxHp: Math.max(1, Number(monster.maxHp) || hp || 1), conditions: Array.isArray(monster.conditions) ? monster.conditions : [] };
    }

    function updateTokenHealthBar(monster) {
      const token = document.getElementById(`token-${monster.id}`);
      if (!token) return;
      const fill = token.querySelector('.token-health-fill');
      const bar = token.querySelector('.token-health-bar');
      if (!fill || !bar) return;
      const ratio = Math.max(0, Math.min(1, monster.hp / Math.max(1, monster.maxHp || 1)));
      const tier = ratio >= .75 ? ['#2ecc40','Undamaged / Scratched'] : ratio >= .5 ? ['#ff8c00','Bloodied / Hurt'] : ratio >= .25 ? ['#ffd700','Battered / Badly Injured'] : ['#e32636','On Its Last Legs / Critical'];
      fill.style.width = `${ratio * 100}%`;
      fill.style.backgroundColor = tier[0];
      bar.title = `${tier[1]}: ${monster.hp}/${monster.maxHp} HP`;
    }

    function updateTokenDefeatedState(monster) {
      const token = document.getElementById(`token-${monster.id}`);
      if (!token) return;
      token.classList.toggle('is-defeated', Boolean(monster.isplayer && monster.hp <= 0));
      const defeatedX = token.querySelector('.defeated-token-x');
      if (defeatedX) defeatedX.style.fontSize = `${currentTokenSize * .82}px`;
    }

    function refreshMapTokenSelection() {
      document.querySelectorAll('.monster-token').forEach(token => token.classList.toggle('is-selected', selectedMapTokenIds.has(token.id.replace('token-',''))));
      const selected = monsters.filter(monster => selectedMapTokenIds.has(monster.id));
      document.getElementById('mapActionTargets').textContent = selected.length === 1 ? selected[0].name : `${selected.length} tokens selected`;
      if (!selected.length) document.getElementById('mapActionPanel').classList.remove('is-open');
    }

    function selectMapToken(monsterId, additive) {
      if (!additive) selectedMapTokenIds.clear();
      if (additive && selectedMapTokenIds.has(monsterId)) selectedMapTokenIds.delete(monsterId); else selectedMapTokenIds.add(monsterId);
      refreshMapTokenSelection();
      if (selectedMapTokenIds.size) document.getElementById('mapActionPanel').classList.add('is-open');
    }

    function clearMapTokenSelection() { selectedMapTokenIds.clear(); refreshMapTokenSelection(); }
    function updateMapActionFields() {
      const action=document.getElementById('mapActionType').value;
      const usesAmount = ['damage','heal'].includes(action);
      document.getElementById('mapActionAmountGroup').style.display = usesAmount ? 'block' : 'none';
      document.getElementById('mapActionConditionGroup').style.display = ['apply','remove'].includes(action) ? 'block' : 'none';
    }

    function removeCreatureById(monsterId,sync=true){const index=monsters.findIndex(monster=>monster.id===monsterId);if(index>=0)monsters.splice(index,1);selectedMapTokenIds.delete(monsterId);document.getElementById(`token-${monsterId}`)?.remove();updatePlayerTokenInitiativeLabels();renderPartyTracker();refreshMapTokenSelection();if(sync)syncMonstersToFirebase();}

    function showTokenDeathEffect(monsterId) {
      const token = document.getElementById(`token-${monsterId}`);
      if (!token) return;
      const rect = token.getBoundingClientRect();
      const icon = document.createElement('img');
      icon.className = 'token-death-effect'; icon.src = 'data/images/dead_icon.png'; icon.alt = '';
      icon.style.left = `${rect.left + rect.width / 2}px`; icon.style.top = `${rect.top + rect.height / 2 - 36}px`;
      document.body.appendChild(icon); icon.addEventListener('animationend', () => icon.remove(), { once:true });
    }

    function removeDefeatedMonster(monsterId) {
      const index = monsters.findIndex(monster => monster.id === monsterId);
      const monster = index >= 0 ? monsters[index] : null;
      if (monster?.isplayer) { updateTokenDefeatedState(monster); return; }
      if (index >= 0) monsters.splice(index,1);
      selectedMapTokenIds.delete(monsterId);
      document.getElementById(`token-${monsterId}`)?.remove();
    }

    function applyMapTokenAction() {
      const action = document.getElementById('mapActionType').value;
      const amount = Math.max(0, Number(document.getElementById('mapActionAmount').value) || 0);
      const condition = document.getElementById('mapActionCondition').value;
      const targets = monsters.filter(monster => selectedMapTokenIds.has(monster.id));
      targets.forEach(monster => {
        const previousHp = monster.hp;
        if (action === 'heal') { monster.hp = Math.min(monster.maxHp, monster.hp + amount); flashToken(monster.id,'heal'); }
        else if (action === 'damage') { monster.hp = monster.isplayer ? monster.hp-amount : Math.max(0,monster.hp-amount); flashToken(monster.id,'damage'); if (previousHp > 0 && monster.hp <= 0) { showTokenDeathEffect(monster.id); removeDefeatedMonster(monster.id); } }
        else if (action === 'apply' && !monster.conditions.some(item => item.toLowerCase() === condition.toLowerCase())) monster.conditions.push(condition);
        else if (action === 'remove') monster.conditions = monster.conditions.filter(item => item.toLowerCase() !== condition.toLowerCase());
        else if (action === 'removeCreature') removeCreatureById(monster.id,false);
        updateTokenHealthBar(monster); updateTokenDefeatedState(monster);
        const conditionLabel = document.querySelector(`#token-${CSS.escape(monster.id)} .condition-label`);
        if (conditionLabel) conditionLabel.textContent = monster.conditions.join(', ');
        if (monster.id === currentPlayerId) document.getElementById('currentHP').value = monster.hp;
      });
      refreshMapTokenSelection();
      syncMonstersToFirebase();
      renderPartyTracker();
    }

    function positionTokenElement(monster, element = document.getElementById(`token-${monster.id}`)) {
      if (!element || !mapImage?.clientWidth || !mapImage?.clientHeight) return;

      element.style.left = `${monster.xRatio * mapImage.clientWidth - currentTokenSize / 2}px`;
      element.style.top = `${monster.yRatio * mapImage.clientHeight - currentTokenSize / 2}px`;
      element.style.width = `${currentTokenSize}px`;
      element.style.height = `${currentTokenSize}px`;

      const label = element.querySelector('.token-label');
      if (label) {
        label.style.fontSize = `${currentTokenSize / 5}px`;
      }

      const conditionLabel = element.querySelector('.condition-label');
      if (conditionLabel) {
        conditionLabel.style.fontSize = `${currentTokenSize / 5}px`;
      }
      element.classList.toggle('is-defeated', Boolean(monster.isplayer && monster.hp <= 0));
      const defeatedX = element.querySelector('.defeated-token-x');
      if (defeatedX) defeatedX.style.fontSize = `${currentTokenSize * 0.82}px`;
      updateTokenHealthBar(monster);
    }

    function refreshMapLayout() {
      if (!mapImage?.clientWidth || !mapImage?.clientHeight) return false;

      tokenLayer.style.width = `${mapImage.clientWidth}px`;
      tokenLayer.style.height = `${mapImage.clientHeight}px`;
      monsters.forEach(monster => positionTokenElement(monster));
      return true;
    }

    function scheduleMapLayoutRefresh(attempts = 12) {
      requestAnimationFrame(() => {
        if (!refreshMapLayout() && attempts > 0) {
          scheduleMapLayoutRefresh(attempts - 1);
        }
      });
    }


    function addMonsterToken(monster) {
      const container = document.createElement('div');
      container.id = `token-${monster.id}`;
      container.className = 'monster-token';
      container.style.position = 'absolute';
      container.style.borderRadius = '50%';
      container.style.border = '2px solid gold';
      container.style.pointerEvents = 'auto';
      container.style.cursor = 'grab';
      container.style.position = 'absolute';
      container.style.display = 'flex';
      container.style.alignItems = 'center';
      container.style.justifyContent = 'center';

      const img = document.createElement('img');
      if (!monster.isplayer) {
        img.src = monster.tokenUrl || `data/monster_tokens/${encodeURIComponent(monster.name)}.webp`;
      } else {
        img.src = `data/player_tokens/${encodeURIComponent(monster.name)}.png`;
      }

      img.style.width = '100%';
      img.style.height = '100%';
      img.style.borderRadius = '50%';
      img.draggable = false;

      const label = document.createElement('div');
      label.className = 'token-label';
      label.style.position = 'absolute';
      label.style.top = '-5px';  // pull up slightly
      label.style.right = '-5px'; // pull right slightly
      label.style.fontSize = `${currentTokenSize / 5}px`;
      label.style.backgroundColor = 'rgba(0,0,0,0.8)';
      label.style.color = 'white';
      label.style.padding = '2px 6px';
      label.style.borderRadius = '6px';
      label.style.zIndex = '10';
      label.style.pointerEvents = 'none';
      label.textContent = '?';

      const conditionLabel = document.createElement('div');
      conditionLabel.className = 'condition-label';
      conditionLabel.style.position = 'absolute';
      conditionLabel.style.bottom = '-30px';
      conditionLabel.style.left = '50%';
      conditionLabel.style.transform = 'translateX(-50%)';
      conditionLabel.style.fontSize = `${currentTokenSize / 5}px`;
      conditionLabel.style.backgroundColor = 'rgba(0,0,0,0.7)';
      conditionLabel.style.color = 'white';
      conditionLabel.style.padding = '2px 4px';
      conditionLabel.style.borderRadius = '4px';
      conditionLabel.style.pointerEvents = 'none';
      conditionLabel.textContent = (monster.conditions || []).join(', ');

      const healthBar = document.createElement('div');
      healthBar.className = 'token-health-bar';
      const healthFill = document.createElement('div');
      healthFill.className = 'token-health-fill';
      const initialHealthRatio=Math.max(0,Math.min(1,monster.hp/Math.max(1,monster.maxHp||1)));
      healthFill.style.width=`${initialHealthRatio*100}%`;
      healthFill.style.backgroundColor=initialHealthRatio>=.75?'#2ecc40':initialHealthRatio>=.5?'#ff8c00':initialHealthRatio>=.25?'#ffd700':'#e32636';
      healthBar.appendChild(healthFill);

      const defeatedX = document.createElement('div');
      defeatedX.className = 'defeated-token-x';
      defeatedX.textContent = '×';

      container.appendChild(img);
      container.appendChild(label);
      container.appendChild(healthBar);
      container.appendChild(defeatedX);
      container.appendChild(conditionLabel);
      container.addEventListener('click', event => {
        event.stopPropagation();
        if (container.dataset.suppressClick === 'true') return;
        selectMapToken(monster.id, event.ctrlKey);
      });
      makeDraggable(container);
      tokenLayer.appendChild(container);
      positionTokenElement(monster, container);
    }

    function makeDraggable(el) {
      let isDragging = false;
      let offsetX = 0, offsetY = 0;
      let dragStartX = 0, dragStartY = 0, didMove = false;

      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isDragging = true;
        didMove = false; dragStartX = e.clientX; dragStartY = e.clientY;
        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;
        el.style.cursor = 'grabbing';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        if (Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>3) didMove=true;
        el.style.left = `${e.clientX - offsetX}px`;
        el.style.top = `${e.clientY - offsetY}px`;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          el.style.cursor = 'grab';
          isDragging = false;

          const id = el.id.replace('token-', '');
          const monster = monsters.find(m => m.id === id);
          if (monster) {
            const leftPx = parseInt(el.style.left) + currentTokenSize / 2;
            const topPx = parseInt(el.style.top) + currentTokenSize / 2;
            monster.xRatio = leftPx / mapImage.clientWidth;
            monster.yRatio = topPx / mapImage.clientHeight;
          }
          syncMonstersToFirebase();
          if (didMove) { el.dataset.suppressClick='true'; setTimeout(()=>{el.dataset.suppressClick='false';},0); }
        }
      });

      // TOUCH support for dragging
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isDragging = true;
        const touch = e.touches[0];
        offsetX = touch.clientX - el.offsetLeft;
        offsetY = touch.clientY - el.offsetTop;
        el.style.cursor = 'grabbing';
      }, { passive: false });

      el.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        el.style.left = `${touch.clientX - offsetX}px`;
        el.style.top = `${touch.clientY - offsetY}px`;
      }, { passive: false });

      el.addEventListener('touchend', () => {
        if (isDragging) {
          el.style.cursor = 'grab';
          isDragging = false;

          const id = el.id.replace('token-', '');
          const monster = monsters.find(m => m.id === id);
          if (monster) {
            const leftPx = parseInt(el.style.left) + currentTokenSize / 2;
            const topPx = parseInt(el.style.top) + currentTokenSize / 2;
            monster.xRatio = leftPx / mapImage.clientWidth;
            monster.yRatio = topPx / mapImage.clientHeight;
          }
          syncMonstersToFirebase();
        }
      });

    }

    function generateID() {
      return '_' + Math.random().toString(36).substr(2, 9);
    }

    let currentTokenSize = 100;  // default size in pixels

    function updateAllTokenSizes() {
      refreshMapLayout();
      syncMonstersToFirebase();
    }

    document.getElementById('increaseTokenSize').addEventListener('click', () => {
      currentTokenSize += 10;
      updateAllTokenSizes();
    });

    document.getElementById('decreaseTokenSize').addEventListener('click', () => {
      currentTokenSize = Math.max(11, currentTokenSize - 10);
      updateAllTokenSizes();
    });


    const playerSelect = document.getElementById('playerSelect');
    const playerNameLabel = document.querySelector('h1');

    let currentPlayerId = null;  // Track currently selected player's ID

    playerSelect.addEventListener('change', () => {
      const name = playerSelect.value;
      playerNameLabel.textContent = name;

      // Remove previous token if it exists
      if (currentPlayerId) {
        const index = monsters.findIndex(m => m.id === currentPlayerId);
        if (index !== -1) {
          monsters.splice(index, 1);
          const oldEl = document.getElementById(`token-${currentPlayerId}`);
          if (oldEl) oldEl.remove();
        }
      }

      const id = generateID();
      currentPlayerId = id;

      const token = {
        id: id,
        name: name,
        hp: parseInt(document.getElementById('currentHP').value),
        maxHp: Math.max(1, parseInt(document.getElementById('currentHP').value) || 1),
        init: parseInt(document.getElementById('initiativeInput').value),
        conditions: [],
        xRatio: 0.5,
        yRatio: 0.5,
        isplayer: true
      };

      monsters.push(token);
      addMonsterToken(token);
      syncMonstersToFirebase();
    });

    // Update HP and initiative on input change
    document.getElementById('currentHP').addEventListener('input', () => {
      const m = monsters.find(m => m.id === currentPlayerId);
      if (m) {
        const previousHp = m.hp;
        m.hp = parseInt(document.getElementById('currentHP').value) || 0;
        m.maxHp = Math.max(m.maxHp || 1, m.hp);
        if (m.hp > previousHp) flashToken(m.id,'heal');
        else if (m.hp < previousHp) flashToken(m.id,'damage');
        if (previousHp > 0 && m.hp <= 0) showTokenDeathEffect(m.id);
        updateTokenHealthBar(m); updateTokenDefeatedState(m);
        syncMonstersToFirebase();
      }
    });

    document.getElementById('initiativeInput').addEventListener('input', () => {
      const m = monsters.find(m => m.id === currentPlayerId);
      if (m) {
        m.init = parseInt(document.getElementById('initiativeInput').value);
        syncMonstersToFirebase();
      }
    });



    // FIREBASE SYNCHRONIZATON
    function syncMonstersToFirebase() {
      const monstersRef = db.collection("shared").doc("monsters");

      return monstersRef.get().then(doc => {

        const serverData = doc.data();
        const now = Date.now();

        // If local data is older, abort
        if (serverData?.updatedAt > lastSyncedAt) {
          alert("Sync aborted: Firebase has newer data.");
          forceReloadMonsters();
          return;
        }

        const payload = {
          monsters,
          updatedAt: Date.now()
        };

        lastSyncedAt = now;

        return doc.exists
          ? monstersRef.update(payload)
          : monstersRef.set(payload);
      }).then(() => {
        console.log("Monsters synced.");
      }).catch(err => {
        console.error("Error syncing monsters:", err);
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function forceReloadMonsters() {
      const monstersRef = db.collection("shared").doc("monsters");

      monstersRef.get().then(doc => {
        if (!doc.exists) {
          console.warn("No monster data found in Firebase.");
          return;
        }

        const data = doc.data();
        if (!Array.isArray(data.monsters)) return;

        lastSyncedAt = data.updatedAt;

        monsters.length = 0;
        document.getElementById('mapTokenLayer').innerHTML = '';

        data.monsters.forEach(m => {
          const normalized=normalizeMonsterState(m);
          if(normalized.hp<=0&&!normalized.isplayer)return;
          monsters.push(normalized);
          addMonsterToken(normalized);
        });

        scheduleMapLayoutRefresh();
        updatePlayerTokenInitiativeLabels();
        renderPartyTracker();
        //updateMonsterTable();
        console.log("Monsters force-reloaded from Firebase.");
      }).catch(err => {
        console.error("Failed to reload monsters from Firebase:", err);
      });
    }


    // Execute Action Button
    const executeBtn = document.getElementById('executeBtn');

    executeBtn?.addEventListener('click', async () => {
      const action = document.getElementById('actionSelect').value;
      const index = parseInt(document.getElementById('targetIndex').value);
      const condition = document.getElementById('conditionSelect').value;
      const amount = parseInt(document.getElementById('amountTurns').value);

      if (index < 0 || index >= monsters.length) {
        alert("Invalid target index.");
        return;
      }


      const monster = monsters[index];
      const previousHP = monster.hp;


      if (action === 'heal') {
        monster.hp = Math.min(monster.maxHp || monster.hp + amount, monster.hp + amount);

        flashToken(monster.id, 'heal');
        await sleep(1000);

      } else if (action === 'damage') {
        monster.hp = monster.isplayer ? monster.hp - amount : Math.max(0, monster.hp - amount);

        flashToken(monster.id, 'damage');
        if (previousHP > 0 && monster.hp <= 0) {
          showTokenDeathEffect(monster.id);
          removeDefeatedMonster(monster.id);
        }
        await sleep(1000);

      } else if (action === 'apply') {
        if (condition !== "-- None --" && !monster.conditions.includes(condition)) {
          monster.conditions.push(condition);
        }
      } else if (action === 'remove') {
        if (condition !== "-- None --") {
          monster.conditions = monster.conditions.filter(c => c.toLowerCase() !== condition.toLowerCase());
        }
      }


      syncMonstersToFirebase();




    });

    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let panOffsetX = 0, panOffsetY = 0;
    let scale = 1;

    const updateTransform = () => {
      const mapTransformLayer = document.getElementById('mapTransformLayer');
      mapTransformLayer.style.transform = `translate(${panOffsetX}px, ${panOffsetY}px) scale(${scale})`;
    };

    const mapTab = document.getElementById('scrollWrapper');
    const playerMapTransformLayer = document.getElementById('mapTransformLayer');
    const tokenLasso = document.getElementById('tokenLasso');
    const tokenLassoPath = document.getElementById('tokenLassoPath');
    let lassoPoints = [];

    function mapClientToLocal(clientX, clientY) {
      const rect = mapImage.getBoundingClientRect();
      return { x:(clientX-rect.left)*(mapImage.clientWidth/rect.width), y:(clientY-rect.top)*(mapImage.clientHeight/rect.height) };
    }

    function isPointInsideLasso(point,polygon){let inside=false;for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){const a=polygon[i],b=polygon[j];if(((a.y>point.y)!==(b.y>point.y))&&point.x<(b.x-a.x)*(point.y-a.y)/((b.y-a.y)||.00001)+a.x)inside=!inside;}return inside;}
    function renderTokenLasso(){tokenLassoPath.setAttribute('points',lassoPoints.map(point=>`${point.x},${point.y}`).join(' '));}

    playerMapTransformLayer.addEventListener('mousedown', event => {
      if (!event.ctrlKey || event.button !== 0 || event.target.closest('.monster-token')) return;
      event.preventDefault(); event.stopPropagation();
      lassoPoints=[mapClientToLocal(event.clientX,event.clientY)];
      tokenLasso.style.display='block'; tokenLasso.setAttribute('viewBox',`0 0 ${mapImage.clientWidth} ${mapImage.clientHeight}`); renderTokenLasso();
    }, true);

    document.addEventListener('mousemove', event => {
      if (!lassoPoints.length) return;
      const point=mapClientToLocal(event.clientX,event.clientY);
      const previous=lassoPoints[lassoPoints.length-1]; if(Math.hypot(point.x-previous.x,point.y-previous.y)>=3)lassoPoints.push(point); renderTokenLasso();
    });

    document.addEventListener('mouseup', event => {
      if (!lassoPoints.length) return;
      if(lassoPoints.length>=3)monsters.forEach(monster=>{if(isPointInsideLasso({x:monster.xRatio*mapImage.clientWidth,y:monster.yRatio*mapImage.clientHeight},lassoPoints))selectedMapTokenIds.add(monster.id);});
      lassoPoints=[]; tokenLassoPath.setAttribute('points',''); tokenLasso.style.display='none'; refreshMapTokenSelection();
      if(selectedMapTokenIds.size)document.getElementById('mapActionPanel').classList.add('is-open');
    });

    // PAN START
    mapTab.addEventListener('mousedown', (e) => {
      // Only start pan if clicking background (not tokens)
      const isMapBackground = e.target === mapTab || e.target === mapContainer || e.target.id === 'mapImage';
      if (!isMapBackground) return;

      isPanning = true;
      panStartX = e.clientX - panOffsetX;
      panStartY = e.clientY - panOffsetY;
      mapTab.style.cursor = 'grabbing';

      // Lock dragging to this gesture only
      e.preventDefault();
    });

    // PAN MOVE
    document.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panOffsetX = e.clientX - panStartX;
      panOffsetY = e.clientY - panStartY;
      updateTransform();
    });

    // PAN END
    document.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        mapTab.style.cursor = 'default';
      }
    });

    // ZOOM
    mapTab.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      scale = Math.min(Math.max(0.2, scale + delta), 3);
      updateTransform();
    });

    // touch support for panning and zooming
    let isTouchPanning = false;
    let lastTouchX = 0, lastTouchY = 0;
    let lastTouchDistance = null;

    // Touch start
    mapTab.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const target = e.target;
        const isMapBackground = target === mapTab || target === mapContainer || target.id === 'mapImage';
        if (!isMapBackground) return;

        isTouchPanning = true;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        // Start pinch zoom
        lastTouchDistance = getTouchDistance(e.touches);
      }
    }, { passive: false });

    // Touch move
    mapTab.addEventListener('touchmove', (e) => {
      e.preventDefault();

      if (isTouchPanning && e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;

        panOffsetX += dx;
        panOffsetY += dy;

        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;

        updateTransform();
      } else if (e.touches.length === 2) {
        const currentDistance = getTouchDistance(e.touches);
        if (lastTouchDistance !== null) {
          const zoomFactor = currentDistance / lastTouchDistance;
          scale = Math.min(Math.max(0.2, scale * zoomFactor), 3);
          updateTransform();
        }
        lastTouchDistance = currentDistance;
      }
    }, { passive: false });

    // Touch end
    mapTab.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isTouchPanning = false;
        lastTouchDistance = null;
      }
    });

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }


    function flashToken(monsterId, type, attempts = 5) {
      const token = document.getElementById(`token-${monsterId}`);
      if (!token && attempts > 0) {
        // Retry shortly later if token not yet in DOM
        setTimeout(() => flashToken(monsterId, type, attempts - 1), 100);
        return;
      }
      if (!token) return;

      const rect=token.getBoundingClientRect();
      const effect=document.createElement('div');
      effect.className=`combat-flash-effect ${type==='heal'?'flash-green':'flash-red'}`;
      effect.style.left=`${rect.left}px`; effect.style.top=`${rect.top}px`; effect.style.width=`${rect.width}px`; effect.style.height=`${rect.height}px`;
      document.body.appendChild(effect); effect.addEventListener('animationend',()=>effect.remove(),{once:true});
    }

    // Shared audio. Track/effect choices are synchronized through Firestore;
    // volume remains local to this browser instance.
    const sharedAudioRef = db.collection("shared").doc("audio");
    let bgAudio = new Audio();
    bgAudio.loop = true;
    let sfxVolume = 1;
    let currentMusicPath = '';
    let pendingMusicPath = '';
    let lastSharedSfxEventId = null;
    let sharedAudioSnapshotSeen = false;

    function makeAudioEventId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function publishSharedMusic(path) {
      return sharedAudioRef.set({
        musicPath: path || '',
        musicEventId: makeAudioEventId(),
        musicChangedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(error => console.error('Failed to sync background music:', error));
    }

    function publishSharedSfx(src) {
      return sharedAudioRef.set({
        sfxPath: src,
        sfxEventId: makeAudioEventId(),
        sfxSentAt: Date.now(),
        sfxChangedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(error => console.error('Failed to sync sound effect:', error));
    }

    function applySharedMusic(path) {
      const nextPath = path || '';
      document.querySelectorAll('#dockMusicSelect, #bgMusicSelect').forEach(select => {
        if ([...select.options].some(option => option.value === nextPath)) select.value = nextPath;
      });
      if (!nextPath) {
        bgAudio.pause();
        bgAudio.removeAttribute('src');
        bgAudio.load();
        currentMusicPath = '';
        pendingMusicPath = '';
        return;
      }
      if (currentMusicPath !== nextPath) {
        bgAudio.src = nextPath;
        currentMusicPath = nextPath;
      }
      const playRequest = bgAudio.play();
      if (playRequest) playRequest.then(() => { pendingMusicPath = ''; }).catch(() => { pendingMusicPath = nextPath; });
    }

    function applySharedSfx(src) {
      if (!src) return;
      const sfx = new Audio(src);
      sfx.volume = sfxVolume;
      const playRequest = sfx.play();
      if (playRequest) playRequest.catch(error => console.warn('Sound effect playback was blocked:', error));
    }

    function handleMusicChange() {
      publishSharedMusic(document.getElementById("bgMusicSelect").value);
    }

    function handleDockMusicChange(path) {
      publishSharedMusic(path);
    }
    function setMusicVolume(value) { bgAudio.volume = Number(value); }
    function setSfxVolume(value) { sfxVolume = Number(value); }

    function playSoundEffect(src) { publishSharedSfx(src); }

    sharedAudioRef.onSnapshot(snapshot => {
      if (!snapshot.exists) return;
      const audioState = snapshot.data() || {};
      applySharedMusic(audioState.musicPath || '');

      const eventId = audioState.sfxEventId || null;
      if (eventId && eventId !== lastSharedSfxEventId) {
        // Do not replay an old stored effect when a page first opens. A newly
        // sent effect is still accepted if it arrives with the first snapshot.
        const isRecent = Date.now() - Number(audioState.sfxSentAt || 0) < 5000;
        if (sharedAudioSnapshotSeen || isRecent) applySharedSfx(audioState.sfxPath);
        lastSharedSfxEventId = eventId;
      }
      sharedAudioSnapshotSeen = true;
    }, error => console.error('Failed to receive shared audio:', error));

    document.addEventListener('pointerdown', () => {
      if (pendingMusicPath) applySharedMusic(pendingMusicPath);
    }, { passive: true });



    // FIREBASE ACTION HANDLER

    // Load monsters from Firebase on page load
    const monstersRef = db.collection("shared").doc("monsters");

    let lastSyncedAt = 0;

    monstersRef.onSnapshot(doc => {
      if (!doc.exists) {
        console.log("No monsters found in Firebase.");
        return;
      }

      const data = doc.data();
      if (!Array.isArray(data.monsters)) return;

      // Only update if Firebase data is newer
      if (data.updatedAt < lastSyncedAt) return;

      lastSyncedAt = data.updatedAt;

      // Store previous HP for comparison
      const previousHP = {};
      monsters.forEach(m => previousHP[m.id] = m.hp);

      // Clear local array *in-place*
      monsters.length = 0;

      // Clear existing tokens
      document.getElementById('mapTokenLayer').innerHTML = '';

      // Rebuild state and tokens
      data.monsters.forEach(m => {
        const normalized=normalizeMonsterState(m);
        if(normalized.hp<=0&&!normalized.isplayer)return;
        monsters.push(normalized);
        addMonsterToken(normalized);

        // Compare HP for animation
        const oldHP = previousHP[normalized.id];
        if (typeof oldHP === 'number') {
          if (normalized.hp > oldHP) flashToken(normalized.id, 'heal');
          else if (normalized.hp < oldHP) flashToken(normalized.id, 'damage');
        }

      });

      scheduleMapLayoutRefresh();
      // Update token labels with index
      monsters.forEach((m, i) => {
        const token = document.getElementById(`token-${m.id}`);
        if (token) {
          const label = token.querySelector('.token-label');
          if (label) label.textContent = i;
        }
      });
      updatePlayerTokenInitiativeLabels();
      refreshMapTokenSelection();
      renderPartyTracker();

    });

    const mapRef = db.collection("shared").doc("map");
    const drawingToolbarManager = setupSharedMapDrawing({
      db,
      mapImage,
      compact: true,
      startCollapsed: true,
      mapTransformLayer: document.getElementById('mapTransformLayer'),
      tokenLayer: document.getElementById('mapTokenLayer'),
      toolbarPosition: {
        top: '80px',
        left: '25px'
      }
    });
    let drawingToolbarHidden = false;
    document.getElementById('toggleDrawingToolbar')?.addEventListener('click', event => {
      drawingToolbarHidden = !drawingToolbarHidden;
      drawingToolbarManager.setVisible(!drawingToolbarHidden);
      event.currentTarget.textContent = drawingToolbarHidden ? 'Show Drawing' : 'Hide Drawing';
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      drawingToolbarManager.setTool('pan');
      clearMapTokenSelection();
    });

    mapImage.addEventListener('load', () => {
      scheduleMapLayoutRefresh();
    });

    window.addEventListener('resize', () => {
      scheduleMapLayoutRefresh();
    });

    if (typeof ResizeObserver === 'function') {
      const mapResizeObserver = new ResizeObserver(() => {
        refreshMapLayout();
      });
      mapResizeObserver.observe(mapImage);
    }

    scheduleMapLayoutRefresh();

    mapRef.onSnapshot(doc => {
      if (doc.exists && doc.data()?.filepath) {
        mapImage.src = doc.data().filepath;
        scheduleMapLayoutRefresh();
      }
    });



  </script>
</body>

</html>
