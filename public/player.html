<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Viewer</title>
  <!-- Fantasy Font -->
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    body {
      background-color: #121212;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
    }

    .monster-token.is-defeated img { filter: grayscale(1) brightness(.42); }
    .defeated-token-x { display: none; position: absolute; inset: 0; z-index: 18; align-items: center; justify-content: center; color: #e00000; font-family: Arial, sans-serif; font-weight: 900; line-height: 1; text-shadow: 0 0 4px #000, 2px 2px 0 #330000; pointer-events: none; }
    .monster-token.is-defeated .defeated-token-x { display: flex; }
    .monster-token.is-selected { border-color: #4fc3ff !important; box-shadow: 0 0 0 3px rgba(79,195,255,.8), 0 0 18px #4fc3ff; }
    .token-health-bar { position:absolute; left:0; bottom:-8px; width:100%; height:7px; overflow:hidden; background:#3b1111; border:1px solid #111; border-radius:4px; box-sizing:border-box; pointer-events:none; }
    .token-health-fill { height:100%; width:100%; background:#2ecc40; transition:width .25s ease, background-color .25s ease; }
    .map-action-panel { display:none; position:fixed; z-index:2200; top:80px; right:20px; width:280px; padding:14px; background:rgba(20,20,20,.97); border:2px solid #4fc3ff; border-radius:9px; box-shadow:0 8px 30px #000; color:white; }
    .map-action-panel.is-open { display:block; }
    .map-action-panel h3 { margin:0 0 4px; color:#FFD700; }
    .map-action-panel select, .map-action-panel input, .map-action-panel button { width:100%; box-sizing:border-box; margin-top:8px; padding:9px; background:#333; color:white; border:1px solid #666; border-radius:5px; }
    .map-action-panel button { background:#32CD32; color:#111; border:0; font-weight:bold; cursor:pointer; }
    .map-action-panel .map-action-close { position:absolute; top:4px; right:7px; width:auto; margin:0; padding:3px 7px; background:transparent; color:#bbb; }
    .token-lasso { position:absolute; inset:0; z-index:30; width:100%; height:100%; pointer-events:none; overflow:visible; }
    .token-lasso polyline { fill:rgba(79,195,255,.16); stroke:#4fc3ff; stroke-width:3; stroke-dasharray:9 6; stroke-linejoin:round; }
    .group-move-handle { position:absolute; z-index:35; width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center; color:#111; background:#4fc3ff; border:2px solid white; border-radius:50%; box-shadow:0 2px 9px #000,0 0 0 2px rgba(79,195,255,.45); font-size:23px; line-height:1; cursor:move; pointer-events:auto; touch-action:none; user-select:none; }
    .combat-flash-effect { position:fixed; z-index:2900; border-radius:50%; pointer-events:none; }
    .combat-flash-effect.flash-red { animation:flash-red 1s ease-out forwards; }
    .combat-flash-effect.flash-green { animation:flash-green 1s ease-out forwards; }
    .token-death-effect { position:fixed; z-index:3000; width:72px; height:72px; object-fit:contain; pointer-events:none; animation:token-death-float 1.6s ease-out forwards; }
    #menu, #toggleMenuStandalone { display:none !important; }
    .party-panel { position:fixed; top:70px; bottom:42px; left:0; z-index:1100; width:400px; max-height:none; overflow:visible; padding:12px; box-sizing:border-box; color:white; background:rgba(15,15,15,.92); border:1px solid #666; border-left:0; border-radius:0 9px 9px 0; transition:transform .25s ease; }
    .party-panel.is-collapsed { transform:translateX(-100%); }
    .player-left-rail { position:absolute; top:calc(50vh - 70px); right:-42px; transform:translateY(-50%); display:flex; flex-direction:column; width:42px; gap:5px; }
    .player-left-rail button { width:42px; min-width:0; height:82px; padding:0 !important; border-radius:0 7px 7px 0 !important; background:#111 !important; color:#FFD700 !important; border:1px solid #FFD700 !important; border-left:0 !important; cursor:pointer; }
    .player-left-rail button.is-active { background:#FFD700 !important; color:#111 !important; }
    .player-left-rail svg { width:27px; height:40px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .dice-icon { display:inline-block; width:32px; height:38px; background:#FFD700; -webkit-mask:url('data/images/d20-black.png') center/contain no-repeat; mask:url('data/images/d20-black.png') center/contain no-repeat; }
    .player-left-rail button.is-active .dice-icon { background:#111; }
    .player-left-panel-content { display:none; height:100%; min-height:0; overflow:auto; flex-direction:column; }
    .player-left-panel-content.is-active { display:flex; }
    .party-panel-content { max-height:none; }
    .party-panel h2 { margin:0 0 8px; color:#FFD700; font-family:'MedievalSharp',cursive; }
    .party-table { width:100%; border-collapse:collapse; font-size:.85rem; }
    .party-table th,.party-table td { padding:5px; border:1px solid #555; }
    .party-table input { width:58px; box-sizing:border-box; background:#292929; color:white; border:1px solid #666; }
    .dice-roller { gap:14px; }
    .dice-roller-form { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .dice-roller label { display:flex; flex-direction:column; gap:5px; color:#FFD700; font-weight:bold; }
    .dice-roller select,.dice-roller input { box-sizing:border-box; width:100%; padding:10px; color:white; background:#292929; border:1px solid #666; border-radius:5px; font-size:1rem; }
    .dice-counter { display:grid; grid-template-columns:34px minmax(0,1fr) 34px; justify-items:center; align-items:center; gap:4px; padding:7px 5px; background:#202020; border:1px solid #555; border-radius:6px; color:#FFD700; font-weight:bold; }
    .dice-counter.d20 { grid-column:2; grid-row:1; }
    .dice-counter.row-two { grid-row:2; }
    .dice-counter.row-three { grid-row:3; }
    .dice-counter-label { grid-column:1/-1; display:flex; align-items:center; justify-content:center; gap:4px; height:48px; }
    .die-picture { display:inline-block; width:44px; height:44px; flex:0 0 auto; background:#FFD700; -webkit-mask:var(--die-image) center/contain no-repeat; mask:var(--die-image) center/contain no-repeat; }
    .die-picture.d100-back { width:34px; transform:translate(-7px,7px) rotate(-14deg); }
    .die-picture.d100-front { width:34px; margin-left:-25px; transform:translate(9px,-7px) rotate(14deg); }
    .dice-counter button { height:34px; padding:0 !important; font-size:1.2rem; }
    .dice-counter input { padding:7px 3px; text-align:center; }
    .dice-roll-button { width:100%; padding:11px !important; font-size:1rem; }
    .dice-clear-button { width:100%; padding:9px !important; color:#FFD700 !important; background:#333 !important; border:1px solid #FFD700 !important; font-size:.95rem; }
    .dice-result { min-height:105px; padding:12px; color:white; background:#191919; border:1px solid #555; border-radius:7px; overflow-wrap:anywhere; }
    .dice-result strong { color:#FFD700; font-size:1.25rem; }
    .dice-roller .share-dice-roll { flex-direction:row; align-items:center; gap:8px; color:white; font-weight:normal; }
    .dice-roller .share-dice-roll input { width:auto; margin:0; accent-color:#FFD700; }
    .party-panel button,.party-modal button { padding:8px; background:#FFD700; border:0; border-radius:5px; font-weight:bold; cursor:pointer; }
    .session-controls-panel { position:fixed; right:12px; bottom:42px; z-index:1250; display:flex; flex-direction:column; gap:6px; padding:6px; background:rgba(15,15,15,.94); border:1px solid #666; border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,.45); transition:transform .25s ease; }
    .session-controls-panel.is-collapsed { transform:translateX(calc(100% + 12px)); }
    .session-controls-panel button { min-width:70px; margin:0 !important; padding:7px 10px !important; color:white !important; border:0 !important; border-radius:5px !important; font-family:'MedievalSharp',cursive !important; font-size:.85rem !important; cursor:pointer; }
    .session-controls-panel .session-menu-button { background:#1976d2 !important; }
    .session-controls-panel .session-logout-button { background:#a83232 !important; }
    .session-controls-panel .session-controls-toggle { position:absolute; left:-43px; bottom:0; width:43px; min-width:0; height:68px; padding:3px !important; background:#111 !important; color:#FFD700 !important; border:1px solid #FFD700 !important; border-right:0 !important; border-radius:8px 0 0 8px !important; }
    .session-controls-toggle svg { width:34px; height:54px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .audio-dock { position:fixed; left:12px; right:12px; bottom:12px; z-index:1150; display:flex; align-items:flex-start; gap:10px; padding:8px; color:white; background:rgba(15,15,15,.92); border:1px solid #666; border-radius:9px; }
    .audio-dock.is-collapsed .audio-dock-content { display:none; }
    .audio-dock.is-collapsed { height:0; padding:0; border:0; bottom:0; }
    .audio-dock-content { display:grid; grid-template-columns:minmax(105px,.4fr) repeat(3,minmax(0,1fr)); gap:8px 12px; align-items:start; flex:1; }
    .audio-music-controls { display:flex; flex-direction:column; align-items:stretch; gap:8px; }
    .audio-music-controls::before { content:'Background Music'; color:#FFD700; font-weight:bold; font-size:.78rem; text-align:center; }
    .audio-controls { display:flex; flex-direction:column; gap:7px; font-size:.72rem; color:#FFD700; }
    .audio-controls input[type="range"] { accent-color:#FFD700; }
    #dockMusicSelect { padding:6px 9px; background:#111; color:#FFD700; border:1px solid #FFD700; border-radius:4px; }
    .audio-group { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:center; gap:5px; }
    .audio-group strong { grid-column:1/-1; color:#FFD700; font-size:.78rem; text-align:center; }
    .audio-group button { padding:6px 9px; font-size:.76rem; background:#111; color:#FFD700; border:1px solid #FFD700; border-radius:4px; cursor:pointer; }
    .audio-group button:hover { background:#FFD700; color:#111; }
    .audio-group + .audio-group { border-left:1px solid rgba(255,215,0,.55); padding-left:12px; }
    .audio-group.reactions button { color:#55d66b; border-color:#55d66b; }
    .audio-group.reactions button:hover { color:#081b0c; background:#55d66b; }
    .audio-group.combat button { color:#ff5959; border-color:#ff5959; }
    .audio-group.combat button:hover { color:#210606; background:#ff5959; }
    .audio-group.checks button { color:#55a8ff; border-color:#55a8ff; }
    .audio-group.checks button:hover { color:#06172a; background:#55a8ff; }
    .audio-collapse-tab { position:absolute; top:-24px; left:50%; transform:translateX(-50%); width:110px; height:24px; padding:0; background:#111; color:#FFD700; border:1px solid #FFD700; border-bottom:0; border-radius:7px 7px 0 0; cursor:pointer; font-size:24px; line-height:20px; }
    .party-modal { display:none; position:fixed; inset:0; z-index:3500; align-items:center; justify-content:center; background:rgba(0,0,0,.8); }
    .party-modal.is-open { display:flex; }
    .party-modal-card { width:min(620px,90vw); max-height:80vh; overflow:auto; padding:18px; background:#222; color:white; border-radius:10px; }
    .party-choice-list { max-height:55vh; overflow:auto; margin:10px 0; }
    .party-choice { display:flex; justify-content:space-between; width:100%; margin:3px 0; color:white; background:#333 !important; }
    .custom-player-card { width:min(440px,90vw); display:flex; flex-direction:column; gap:10px; }
    .custom-player-card input[type="text"] { padding:9px; color:white; background:#292929; border:1px solid #666; border-radius:5px; }
    .custom-player-preview { width:150px; height:150px; align-self:center; object-fit:cover; border:2px solid #FFD700; border-radius:50%; background:#111; }
    .custom-player-library { max-height:190px; overflow:auto; padding:6px; background:#181818; border:1px solid #555; border-radius:6px; }
    .custom-player-library-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:5px; align-items:center; padding:6px 0; border-bottom:1px solid #444; }
    .custom-player-library-row button { min-width:56px; padding:6px !important; }
    .fantasy-token-button { width:34px; height:34px; padding:0 !important; color:#f4d76d; background:linear-gradient(#4b2915,#1d1009); border:2px ridge #d4af37; border-radius:50% 50% 44% 44%; box-shadow:0 0 0 1px #5b3517,0 2px 5px #000; font-family:Georgia,'Times New Roman',serif; font-size:23px !important; font-weight:bold; line-height:28px; cursor:pointer; text-shadow:0 1px #000; }
    .fantasy-token-button:hover { color:#111; background:#FFD700; }
    .token-size-label { color:#f4d76d; font-family:'MedievalSharp',Georgia,serif; white-space:nowrap; }
    @keyframes token-death-float { 0%{transform:translate(-50%,0) scale(.65);opacity:0} 18%{transform:translate(-50%,-12px) scale(1.1);opacity:1} 100%{transform:translate(-50%,-130px) scale(.85);opacity:0} }

    #menu {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      color: white;
      transition: width 0.3s ease, opacity 0.3s ease;
      overflow-y: auto;
    }

    #menu.fullscreen {
      width: 100%;
      padding: 0;
    }

    #menu.third {
      width: 33.33%;
      padding: 20px;
    }

    #toggleMenu {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #FFD700;
      border: none;
      color: black;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 1000;
    }

    #toggleMenuStandalone {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: #FFD700;
      border: none;
      color: black;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.4rem;
      z-index: 2000;
      display: none;
    }

    #menuContent {
      margin-top: 50px;
    }

    @keyframes flash-red {
      0% {
        box-shadow: 0 0 0px red;
      }

      50% {
        box-shadow: 0 0 40px 20px red;
      }

      100% {
        box-shadow: 0 0 0px red;
      }
    }

    @keyframes flash-green {
      0% {
        box-shadow: 0 0 0px limegreen;
      }

      50% {
        box-shadow: 0 0 40px 20px limegreen;
      }

      100% {
        box-shadow: 0 0 0px limegreen;
      }
    }

    .flash-red {
      animation: flash-red 1s ease-out;
    }

    .flash-green {
      animation: flash-green 1s ease-out;
    }

    .sound-button {
      padding: 10px;
      background-color: #444;
      color: #FFD700;
      border: 1px solid #FFD700;
      border-radius: 5px;
      font-family: 'MedievalSharp', cursive;
      font-size: 1rem;
      cursor: pointer;
    }

    .sound-button:hover {
      background-color: #666;
    }

    .sound-category {
      color: #FFD700;
      font-family: 'MedievalSharp', cursive;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <!-- Scrollable Map Wrapper -->
  <div id="scrollWrapper" style="position: fixed; inset: 0; overflow: auto; z-index: 0;">
    <div id="mapContainer" style="position: relative; display: inline-block;">
      <div id="mapTransformLayer" style="transform-origin: top left; position: relative;">
        <img id="mapImage" src="data/maps/blank.jpg" alt="Map Image" style="width: 100%; height: auto; display: block;">
        <div id="mapTokenLayer"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
        <svg id="tokenLasso" class="token-lasso" style="display:none;"><polyline id="tokenLassoPath" points=""></polyline></svg>
      </div>
    </div>

    <div id="mapActionPanel" class="map-action-panel" role="dialog" aria-label="Token actions">
      <button class="map-action-close" type="button" onclick="clearMapTokenSelection()" aria-label="Close">×</button>
      <h3>Token Actions</h3>
      <div id="mapActionTargets">No tokens selected</div>
      <select id="mapActionType" onchange="updateMapActionFields()"><option value="damage">Damage</option><option value="heal">Heal</option><option value="apply">Apply Condition</option><option value="remove">Remove Condition</option><option value="removeCreature">Remove Creature</option></select>
      <div id="mapActionAmountGroup"><input id="mapActionAmount" type="number" min="0" value="0" placeholder="Amount"></div>
      <div id="mapActionConditionGroup" style="display:none;"><select id="mapActionCondition"><option>Blinded</option><option>Charmed</option><option>Deafened</option><option>Frightened</option><option>Grappled</option><option>Incapacitated</option><option>Invisible</option><option>Paralyzed</option><option>Petrified</option><option>Poisoned</option><option>Prone</option><option>Restrained</option><option>Stunned</option><option>Unconscious</option><option>Exhaustion</option><option>Hexed</option><option>Blessed</option><option>Baned</option><option>mark1</option><option>mark2</option><option>mark3</option></select></div>
      <button type="button" onclick="applyMapTokenAction()">Apply to Selected</button>
    </div>

    <!-- Token Size Controls -->
    <div id="tokenSizeControls" style="
                    position: fixed;
                    top: 8px;
                    left: 10px;
                    background-color: rgba(0, 0, 0, 0.7);
                    padding: 8px 12px;
                    border-radius: 8px;
                    z-index: 1000;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    color: white;
                    font-family: 'MedievalSharp', cursive;
                ">
      <span class="token-size-label">Token Size</span>
      <button id="decreaseTokenSize" class="fantasy-token-button" title="Decrease token size">−</button>
      <button id="increaseTokenSize" class="fantasy-token-button" title="Increase token size">+</button>
    </div>
  </div>

  <aside id="partyPanel" class="party-panel is-collapsed">
    <nav class="player-left-rail" aria-label="Player side panels">
      <button id="partyCollapseButton" type="button" onclick="togglePlayerLeftPanel('party')" aria-label="Party panel" title="Party"><svg viewBox="0 0 28 42" aria-hidden="true"><circle cx="14" cy="9" r="5"/><path d="M6 36c0-9 2-17 8-17s8 8 8 17M9 23l-5 9M19 23l5 9M10 36h8"/></svg></button>
      <button id="playerDiceButton" type="button" onclick="togglePlayerLeftPanel('dice')" aria-label="Dice roller" title="Dice Roller"><span class="dice-icon" aria-hidden="true"></span></button>
    </nav>
    <div id="playerPartyContent" class="party-panel-content player-left-panel-content is-active"><h2>Party</h2>
      <table class="party-table"><thead><tr><th>Name</th><th>Init</th><th>HP</th><th>Max HP</th></tr></thead><tbody id="partyTableBody"></tbody></table>
      <button type="button" style="width:100%;margin-top:8px;" onclick="openPartyPicker()">Add to Party</button>
    </div>
    <div id="playerDiceContent" class="dice-roller player-left-panel-content"><h2>Dice Roller</h2>
      <div class="dice-roller-form">
        <div class="dice-counter d20"><div class="dice-counter-label"><span class="die-picture" style="--die-image:url('data/images/d20-black.png')"></span></div><button type="button" onclick="changeDiceCount('player',20,-1)">−</button><input id="playerDiceCount20" type="number" min="0" max="100" value="1" aria-label="Number of d20 dice"><button type="button" onclick="changeDiceCount('player',20,1)">+</button></div>
        <div class="dice-counter row-two"><div class="dice-counter-label"><span class="die-picture d100-back" style="--die-image:url('data/images/d10-black.png')"></span><span class="die-picture d100-front" style="--die-image:url('data/images/d10-black.png')"></span></div><button type="button" onclick="changeDiceCount('player',100,-1)">−</button><input id="playerDiceCount100" type="number" min="0" max="100" value="0" aria-label="Number of d100 dice"><button type="button" onclick="changeDiceCount('player',100,1)">+</button></div>
        <div class="dice-counter row-two"><div class="dice-counter-label"><span class="die-picture" style="--die-image:url('data/images/d12-black.png')"></span></div><button type="button" onclick="changeDiceCount('player',12,-1)">−</button><input id="playerDiceCount12" type="number" min="0" max="100" value="0" aria-label="Number of d12 dice"><button type="button" onclick="changeDiceCount('player',12,1)">+</button></div>
        <div class="dice-counter row-two"><div class="dice-counter-label"><span class="die-picture" style="--die-image:url('data/images/d10-black.png')"></span></div><button type="button" onclick="changeDiceCount('player',10,-1)">−</button><input id="playerDiceCount10" type="number" min="0" max="100" value="0" aria-label="Number of d10 dice"><button type="button" onclick="changeDiceCount('player',10,1)">+</button></div>
        <div class="dice-counter row-three"><div class="dice-counter-label"><span class="die-picture" style="--die-image:url('data/images/d8-black.png')"></span></div><button type="button" onclick="changeDiceCount('player',8,-1)">−</button><input id="playerDiceCount8" type="number" min="0" max="100" value="0" aria-label="Number of d8 dice"><button type="button" onclick="changeDiceCount('player',8,1)">+</button></div>
        <div class="dice-counter row-three"><div class="dice-counter-label"><span class="die-picture" style="--die-image:url('data/images/d6-black.png')"></span></div><button type="button" onclick="changeDiceCount('player',6,-1)">−</button><input id="playerDiceCount6" type="number" min="0" max="100" value="0" aria-label="Number of d6 dice"><button type="button" onclick="changeDiceCount('player',6,1)">+</button></div>
        <div class="dice-counter row-three"><div class="dice-counter-label"><span class="die-picture" style="--die-image:url('data/images/d4-black.png')"></span></div><button type="button" onclick="changeDiceCount('player',4,-1)">−</button><input id="playerDiceCount4" type="number" min="0" max="100" value="0" aria-label="Number of d4 dice"><button type="button" onclick="changeDiceCount('player',4,1)">+</button></div>
      </div>
      <label>Modifier<input id="playerDiceModifier" type="number" value="0" inputmode="numeric" aria-label="Roll modifier, positive or negative"></label>
      <label>Dice set<select id="playerDiceTheme"><option value="default">Default</option><option value="blueGreenMetal">Blue/Green Metal</option><option value="diceOfRolling">Dice of Rolling</option><option value="gemstone">Gemstone</option><option value="gemstoneMarble">Gemstone Marble</option><option value="rock">Rock</option><option value="rust">Rust</option><option value="smooth">Smooth</option><option value="wooden">Wooden</option></select></label>
      <label class="share-dice-roll"><input id="playerShareDiceRoll" type="checkbox"> Share this roll with everyone</label>

    // Firebase UID identifies the account, not an individual browser instance.
    // sessionStorage gives each browser tab its own stable owner across reloads.
    function getPlayerInstanceId() {
      const storageKey = 'dndPlayerInstanceId';
      try {
        let instanceId = sessionStorage.getItem(storageKey);
        if (!instanceId) {
          instanceId = crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          sessionStorage.setItem(storageKey, instanceId);
        }
        return instanceId;
      } catch (_) {
        return crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }
    }
    const sessionOwnerId = `player-instance:${getPlayerInstanceId()}`;

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "index.html";
        return;

      sessionAccountId = user.uid;

      const logoutBtn = document.getElementById("logoutBtn");

      toggleBtnStandalone.style.display = (state === "hidden") ? "block" : "none";

        menu.classList.add("fullscreen");

        menu.classList.add("third");
      }

      menuState = state;

      if (menuState === "fullscreen") {
        setMenuState("third");

        setMenuState("hidden");

      const ordered = [...monsters].sort((a,b)=>(Number(b.init)||0)-(Number(a.init)||0));

        if(label)label.textContent='×';
      });
    }

    function renderPartyTracker() {
      const body=document.getElementById('partyTableBody'); if(!body)return; body.replaceChildren();
      monsters.filter(monster=>monster.partyManaged&&monster.partyOwner===sessionOwnerId).forEach(monster=>{
        const row=body.insertRow(),nameCell=row.insertCell(),removeButton=document.createElement('button');removeButton.type='button';removeButton.textContent='×';removeButton.title='Remove from party';removeButton.style.cssText='margin-right:5px;padding:1px 5px;background:#c62828;color:white;';removeButton.addEventListener('click',()=>removeCreatureById(monster.id));nameCell.appendChild(removeButton);nameCell.appendChild(document.createTextNode(monster.name));
        ['init','hp','maxHp'].forEach(field=>{const cell=row.insertCell(),input=document.createElement('input');input.type='number';input.value=monster[field]??0;input.addEventListener('change',()=>{monster[field]=Number(input.value)||0;if(field==='maxHp')monster.maxHp=Math.max(1,monster.maxHp);if(field==='hp'&&!monster.isplayer)monster.hp=Math.max(0,monster.hp);updateTokenHealthBar(monster);updateTokenDefeatedState(monster);updatePlayerTokenInitiativeLabels();syncMonstersToFirebase();});cell.appendChild(input);});

    let activePlayerLeftPanel = 'party';
    function togglePlayerLeftPanel(mode){
      const panel=document.getElementById('partyPanel');

      const buttonIds={party:'partyCollapseButton',dice:'playerDiceButton'};
      const isSameOpenPanel=!panel.classList.contains('is-collapsed')&&activePlayerLeftPanel===mode;

      document.querySelectorAll('.player-left-rail button').forEach(button=>button.classList.remove('is-active'));

    function renderGroupMoveHandle(selected) {
      document.getElementById('groupMoveHandle')?.remove();
      if (selected.length < 2 || !mapImage.clientWidth || !mapImage.clientHeight) return;
      const mapWidth = mapImage.clientWidth;
      const mapHeight = mapImage.clientHeight;
      const handle = document.createElement('button');
      handle.id = 'groupMoveHandle'; handle.className = 'group-move-handle'; handle.type = 'button'; handle.textContent = '✥';
      handle.title = `Move ${selected.length} selected tokens`;
      const centerX = selected.reduce((sum, monster) => sum + monster.xRatio * mapWidth, 0) / selected.length;
      const centerY = selected.reduce((sum, monster) => sum + monster.yRatio * mapHeight, 0) / selected.length;
      handle.style.left = `${centerX - 17}px`; handle.style.top = `${centerY - 17}px`;
      tokenLayer.appendChild(handle);
      let dragState = null;
      handle.addEventListener('pointerdown', event => {
        event.preventDefault(); event.stopPropagation();
        dragState = { pointerId:event.pointerId, clientX:event.clientX, clientY:event.clientY, positions:selected.map(monster=>({monster,xRatio:monster.xRatio,yRatio:monster.yRatio})) };
        handle.setPointerCapture?.(event.pointerId);
      });
      handle.addEventListener('pointermove', event => {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        const rawDx=(event.clientX-dragState.clientX)/scale/mapWidth;
        const rawDy=(event.clientY-dragState.clientY)/scale/mapHeight;
        const dxRatio=Math.min(Math.min(...dragState.positions.map(start=>1-start.xRatio)),Math.max(Math.max(...dragState.positions.map(start=>-start.xRatio)),rawDx));
        const dyRatio=Math.min(Math.min(...dragState.positions.map(start=>1-start.yRatio)),Math.max(Math.max(...dragState.positions.map(start=>-start.yRatio)),rawDy));
        dragState.positions.forEach(start=>{start.monster.xRatio=start.xRatio+dxRatio;start.monster.yRatio=start.yRatio+dyRatio;positionTokenElement(start.monster);});
        const centerX=dragState.positions.reduce((sum,start)=>sum+start.monster.xRatio*mapWidth,0)/dragState.positions.length;
        const centerY=dragState.positions.reduce((sum,start)=>sum+start.monster.yRatio*mapHeight,0)/dragState.positions.length;
        handle.style.left=`${centerX-17}px`; handle.style.top=`${centerY-17}px`;
      });
      handle.addEventListener('pointerup', event => { if (!dragState || event.pointerId !== dragState.pointerId) return; dragState=null; syncMonstersToFirebase(); });
      handle.addEventListener('click', event => event.stopPropagation());
    }

    function showTokenDeathEffect(monsterId, broadcast = true) {

    function makeDraggable(el) {
      let isDragging = false;
      let dragOriginLeft = 0, dragOriginTop = 0;
      let dragStartX = 0, dragStartY = 0, didMove = false;

      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isDragging = true;
        didMove = false; dragStartX = e.clientX; dragStartY = e.clientY;
        dragOriginLeft = el.offsetLeft;
        dragOriginTop = el.offsetTop;
        el.style.cursor = 'grabbing';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        if (Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>3) didMove=true;
        el.style.left = `${dragOriginLeft + (e.clientX - dragStartX) / scale}px`;
        el.style.top = `${dragOriginTop + (e.clientY - dragStartY) / scale}px`;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          el.style.cursor = 'grab';
          isDragging = false;

          const id = el.id.replace('token-', '');
          const monster = monsters.find(m => m.id === id);
          if (monster) {
            const leftPx = parseInt(el.style.left) + currentTokenSize / 2;
            const topPx = parseInt(el.style.top) + currentTokenSize / 2;
            monster.xRatio = leftPx / mapImage.clientWidth;
            monster.yRatio = topPx / mapImage.clientHeight;
          }
          syncMonstersToFirebase();
          if (didMove) { el.dataset.suppressClick='true'; setTimeout(()=>{el.dataset.suppressClick='false';},0); }
        }
      });

      // TOUCH support for dragging
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isDragging = true;
        const touch = e.touches[0];
        dragStartX = touch.clientX;
        dragStartY = touch.clientY;
        dragOriginLeft = el.offsetLeft;
        dragOriginTop = el.offsetTop;
        el.style.cursor = 'grabbing';
      }, { passive: false });

      el.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        el.style.left = `${dragOriginLeft + (touch.clientX - dragStartX) / scale}px`;
        el.style.top = `${dragOriginTop + (touch.clientY - dragStartY) / scale}px`;
      }, { passive: false });

      el.addEventListener('touchend', () => {
        if (isDragging) {
          el.style.cursor = 'grab';
          isDragging = false;

          const id = el.id.replace('token-', '');
          const monster = monsters.find(m => m.id === id);
          if (monster) {
            const leftPx = parseInt(el.style.left) + currentTokenSize / 2;
            const topPx = parseInt(el.style.top) + currentTokenSize / 2;
            monster.xRatio = leftPx / mapImage.clientWidth;
            monster.yRatio = topPx / mapImage.clientHeight;
          }
          syncMonstersToFirebase();
        }
      });

    }

    function generateID() {
      return '_' + Math.random().toString(36).substr(2, 9);
    }

    let currentTokenSize = 100;  // default size in pixels

    function updateAllTokenSizes() {
      refreshMapLayout();
      syncMonstersToFirebase();
    }

    document.getElementById('increaseTokenSize').addEventListener('click', () => {
      currentTokenSize += 10;
      updateAllTokenSizes();
    });

    document.getElementById('decreaseTokenSize').addEventListener('click', () => {
      currentTokenSize = Math.max(11, currentTokenSize - 10);
      updateAllTokenSizes();
    });


    const playerSelect = document.getElementById('playerSelect');
    const playerNameLabel = document.querySelector('h1');

    let currentPlayerId = null;  // Track currently selected player's ID

    playerSelect.addEventListener('change', () => {
      const name = playerSelect.value;
      playerNameLabel.textContent = name;

      // Remove previous token if it exists
      if (currentPlayerId) {
        const index = monsters.findIndex(m => m.id === currentPlayerId);
        if (index !== -1) {
          monsters.splice(index, 1);
          const oldEl = document.getElementById(`token-${currentPlayerId}`);
          if (oldEl) oldEl.remove();
        }
      }

      const id = generateID();
      currentPlayerId = id;

      const token = {
        id: id,
        name: name,
        hp: parseInt(document.getElementById('currentHP').value),
        maxHp: Math.max(1, parseInt(document.getElementById('currentHP').value) || 1),
        init: parseInt(document.getElementById('initiativeInput').value),
        conditions: [],
        xRatio: 0.5,
        yRatio: 0.5,
        isplayer: true
      };

      monsters.push(token);
      addMonsterToken(token);
      syncMonstersToFirebase();
    });

    // Update HP and initiative on input change
    document.getElementById('currentHP').addEventListener('input', () => {
      const m = monsters.find(m => m.id === currentPlayerId);
      if (m) {
        const previousHp = m.hp;
        m.hp = parseInt(document.getElementById('currentHP').value) || 0;
        m.maxHp = Math.max(m.maxHp || 1, m.hp);
        if (m.hp > previousHp) flashToken(m.id,'heal');
        else if (m.hp < previousHp) flashToken(m.id,'damage');
        if (previousHp > 0 && m.hp <= 0) showTokenDeathEffect(m.id);
        updateTokenHealthBar(m); updateTokenDefeatedState(m);
        syncMonstersToFirebase();
      }
    });

    document.getElementById('initiativeInput').addEventListener('input', () => {
      const m = monsters.find(m => m.id === currentPlayerId);
      if (m) {
        m.init = parseInt(document.getElementById('initiativeInput').value);
        syncMonstersToFirebase();
      }
    });



    // FIREBASE SYNCHRONIZATON
    function syncMonstersToFirebase() {
      const monstersRef = db.collection("shared").doc("monsters");

      return monstersRef.get().then(doc => {

        const serverData = doc.data();
        const now = Date.now();

        // If local data is older, abort
        if (serverData?.updatedAt > lastSyncedAt) {
          alert("Sync aborted: Firebase has newer data.");
          forceReloadMonsters();
          return;
        }

        const payload = {
          monsters,
          updatedAt: Date.now()
        };

        lastSyncedAt = now;

        return doc.exists
          ? monstersRef.update(payload)
          : monstersRef.set(payload);
      }).then(() => {
        console.log("Monsters synced.");
      }).catch(err => {
        console.error("Error syncing monsters:", err);
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function forceReloadMonsters() {
      const monstersRef = db.collection("shared").doc("monsters");

      monstersRef.get().then(doc => {
        if (!doc.exists) {
          console.warn("No monster data found in Firebase.");
          return;
        }

        const data = doc.data();
        if (!Array.isArray(data.monsters)) return;

        lastSyncedAt = data.updatedAt;

        monsters.length = 0;
        document.getElementById('mapTokenLayer').innerHTML = '';

        data.monsters.forEach(m => {
          const normalized=normalizeMonsterState(m);
          if(normalized.hp<=0&&!normalized.isplayer)return;
          monsters.push(normalized);
          addMonsterToken(normalized);
        });

        scheduleMapLayoutRefresh();
        updatePlayerTokenInitiativeLabels();
        renderPartyTracker();
        //updateMonsterTable();
        console.log("Monsters force-reloaded from Firebase.");
      }).catch(err => {
        console.error("Failed to reload monsters from Firebase:", err);
      });
    }


    // Execute Action Button
    const executeBtn = document.getElementById('executeBtn');

    executeBtn?.addEventListener('click', async () => {
      const action = document.getElementById('actionSelect').value;
      const index = parseInt(document.getElementById('targetIndex').value);
      const condition = document.getElementById('conditionSelect').value;
      const amount = parseInt(document.getElementById('amountTurns').value);

      if (index < 0 || index >= monsters.length) {
        alert("Invalid target index.");
        return;
      }


      const monster = monsters[index];
      const previousHP = monster.hp;


      if (action === 'heal') {
        monster.hp = Math.min(monster.maxHp || monster.hp + amount, monster.hp + amount);

        flashToken(monster.id, 'heal');
        await sleep(1000);

      } else if (action === 'damage') {
        monster.hp = monster.isplayer ? monster.hp - amount : Math.max(0, monster.hp - amount);

        flashToken(monster.id, 'damage');
        if (previousHP > 0 && monster.hp <= 0) {
          showTokenDeathEffect(monster.id);
          removeDefeatedMonster(monster.id);
        }
        await sleep(1000);

      } else if (action === 'apply') {
        if (condition !== "-- None --" && !monster.conditions.includes(condition)) {
          monster.conditions.push(condition);
        }
      } else if (action === 'remove') {
        if (condition !== "-- None --") {
          monster.conditions = monster.conditions.filter(c => c.toLowerCase() !== condition.toLowerCase());
        }
      }


      syncMonstersToFirebase();




    });

    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let panOffsetX = 0, panOffsetY = 0;
    let scale = 1;
    let sharedMapScale = 1;

    const updateTransform = () => {
      const mapTransformLayer = document.getElementById('mapTransformLayer');
      mapTransformLayer.style.transform = `translate(${panOffsetX}px, ${panOffsetY}px) scale(${scale})`;
    };

    function zoomMapAtPoint(nextScale, clientX, clientY) {
      const mapTransformLayer = document.getElementById('mapTransformLayer');
      const rect = mapTransformLayer.getBoundingClientRect();
      const localX = (clientX - rect.left) / scale;
      const localY = (clientY - rect.top) / scale;
      const clampedScale = Math.min(Math.max(0.2, nextScale), 3);
      panOffsetX += localX * (scale - clampedScale);
      panOffsetY += localY * (scale - clampedScale);
      scale = clampedScale;
      updateTransform();
    }

    function applySharedMapScale() {
      if (!mapImage.naturalWidth) return;
      document.getElementById('mapTransformLayer').style.width = `${mapImage.naturalWidth * sharedMapScale}px`;
      scheduleMapLayoutRefresh();
    }

    const mapTab = document.getElementById('scrollWrapper');
    const playerMapTransformLayer = document.getElementById('mapTransformLayer');
    const tokenLasso = document.getElementById('tokenLasso');
    const tokenLassoPath = document.getElementById('tokenLassoPath');
    let lassoPoints = [];

    function mapClientToLocal(clientX, clientY) {
      const rect = mapImage.getBoundingClientRect();
      return { x:(clientX-rect.left)*(mapImage.clientWidth/rect.width), y:(clientY-rect.top)*(mapImage.clientHeight/rect.height) };
    }

    function isPointInsideLasso(point,polygon){let inside=false;for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){const a=polygon[i],b=polygon[j];if(((a.y>point.y)!==(b.y>point.y))&&point.x<(b.x-a.x)*(point.y-a.y)/((b.y-a.y)||.00001)+a.x)inside=!inside;}return inside;}
    function renderTokenLasso(){tokenLassoPath.setAttribute('points',lassoPoints.map(point=>`${point.x},${point.y}`).join(' '));}

    playerMapTransformLayer.addEventListener('mousedown', event => {
      if (event.button !== 2 || event.target.closest('.monster-token')) return;
      event.preventDefault(); event.stopPropagation();
      lassoPoints=[mapClientToLocal(event.clientX,event.clientY)];
      tokenLasso.style.display='block'; tokenLasso.setAttribute('viewBox',`0 0 ${mapImage.clientWidth} ${mapImage.clientHeight}`); renderTokenLasso();
    }, true);

    document.addEventListener('mousemove', event => {
      if (!lassoPoints.length) return;
      const point=mapClientToLocal(event.clientX,event.clientY);
      const previous=lassoPoints[lassoPoints.length-1]; if(Math.hypot(point.x-previous.x,point.y-previous.y)>=3)lassoPoints.push(point); renderTokenLasso();
    });
    playerMapTransformLayer.addEventListener('contextmenu', event => event.preventDefault());

    document.addEventListener('mouseup', event => {
      if (!lassoPoints.length) return;
      if(lassoPoints.length>=3)monsters.forEach(monster=>{if(isPointInsideLasso({x:monster.xRatio*mapImage.clientWidth,y:monster.yRatio*mapImage.clientHeight},lassoPoints))selectedMapTokenIds.add(monster.id);});
      lassoPoints=[]; tokenLassoPath.setAttribute('points',''); tokenLasso.style.display='none'; refreshMapTokenSelection();
      if(selectedMapTokenIds.size)document.getElementById('mapActionPanel').classList.add('is-open');
    });

    // PAN START
    mapTab.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      // Only start pan if clicking background (not tokens)
      const isMapBackground = e.target === mapTab || e.target === mapContainer || e.target.id === 'mapImage';
      if (!isMapBackground) return;

      isPanning = true;
      panStartX = e.clientX - panOffsetX;
      panStartY = e.clientY - panOffsetY;
      mapTab.style.cursor = 'grabbing';

      // Lock dragging to this gesture only
      e.preventDefault();
    });

    // PAN MOVE
    document.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panOffsetX = e.clientX - panStartX;
      panOffsetY = e.clientY - panStartY;
      updateTransform();
    });

    // PAN END
    document.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        mapTab.style.cursor = 'default';
      }
    });

    // ZOOM
    mapTab.addEventListener('wheel', (e) => {
      if (e.target.closest('.party-panel')) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      zoomMapAtPoint(scale + delta, e.clientX, e.clientY);
    });

    // touch support for panning and zooming
    let isTouchPanning = false;
    let lastTouchX = 0, lastTouchY = 0;
    let lastTouchDistance = null;

    // Touch start
    mapTab.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const target = e.target;
        const isMapBackground = target === mapTab || target === mapContainer || target.id === 'mapImage';
        if (!isMapBackground) return;

        isTouchPanning = true;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        // Start pinch zoom
        lastTouchDistance = getTouchDistance(e.touches);
      }
    }, { passive: false });

    // Touch move
    mapTab.addEventListener('touchmove', (e) => {
      e.preventDefault();

      if (isTouchPanning && e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;

        panOffsetX += dx;
        panOffsetY += dy;

        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;

        updateTransform();
      } else if (e.touches.length === 2) {
        const currentDistance = getTouchDistance(e.touches);
        if (lastTouchDistance !== null) {
          const zoomFactor = currentDistance / lastTouchDistance;
          scale = Math.min(Math.max(0.2, scale * zoomFactor), 3);
          updateTransform();
        }
        lastTouchDistance = currentDistance;
      }
    }, { passive: false });

    // Touch end
    mapTab.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isTouchPanning = false;
        lastTouchDistance = null;
      }
    });

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }


    function flashToken(monsterId, type, attempts = 5) {
      const token = document.getElementById(`token-${monsterId}`);
      if (!token && attempts > 0) {
        // Retry shortly later if token not yet in DOM
        setTimeout(() => flashToken(monsterId, type, attempts - 1), 100);
        return;
      }
      if (!token) return;

      const rect=token.getBoundingClientRect();
      const effect=document.createElement('div');
      effect.className=`combat-flash-effect ${type==='heal'?'flash-green':'flash-red'}`;
      effect.style.left=`${rect.left}px`; effect.style.top=`${rect.top}px`; effect.style.width=`${rect.width}px`; effect.style.height=`${rect.height}px`;
      document.body.appendChild(effect); effect.addEventListener('animationend',()=>effect.remove(),{once:true});
    }

    // Shared audio. Track/effect choices are synchronized through Firestore;
    // volume remains local to this browser instance.
    const sharedAudioRef = db.collection("shared").doc("audio");
    let bgAudio = new Audio();
    bgAudio.loop = true;
    let sfxVolume = 1;
    let currentMusicPath = '';
    let pendingMusicPath = '';
    let lastSharedSfxEventId = null;
    let sharedAudioSnapshotSeen = false;

    function makeAudioEventId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function publishSharedMusic(path) {
      return sharedAudioRef.set({
        musicPath: path || '',
        musicEventId: makeAudioEventId(),
        musicChangedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(error => console.error('Failed to sync background music:', error));
    }

    function publishSharedSfx(src) {
      return sharedAudioRef.set({
        sfxPath: src,
        sfxEventId: makeAudioEventId(),
        sfxSentAt: Date.now(),
        sfxChangedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(error => console.error('Failed to sync sound effect:', error));
    }

    function applySharedMusic(path) {
      const nextPath = path || '';
      document.querySelectorAll('#dockMusicSelect, #bgMusicSelect').forEach(select => {
        if ([...select.options].some(option => option.value === nextPath)) select.value = nextPath;
      });
      if (!nextPath) {
        bgAudio.pause();
        bgAudio.removeAttribute('src');
        bgAudio.load();
        currentMusicPath = '';
        pendingMusicPath = '';
        return;
      }
      if (currentMusicPath !== nextPath) {
        bgAudio.src = nextPath;
        currentMusicPath = nextPath;
      }
      const playRequest = bgAudio.play();
      if (playRequest) playRequest.then(() => { pendingMusicPath = ''; }).catch(() => { pendingMusicPath = nextPath; });
    }

    function applySharedSfx(src) {
      if (!src) return;
      const sfx = new Audio(src);
      sfx.volume = sfxVolume;
      const playRequest = sfx.play();
      if (playRequest) playRequest.catch(error => console.warn('Sound effect playback was blocked:', error));
    }

    function handleMusicChange() {
      publishSharedMusic(document.getElementById("bgMusicSelect").value);
    }

    function handleDockMusicChange(path) {
      publishSharedMusic(path);
    }
    function setMusicVolume(value) { bgAudio.volume = Number(value); }
    function setSfxVolume(value) { sfxVolume = Number(value); }

    function playSoundEffect(src) { publishSharedSfx(src); }

    sharedAudioRef.onSnapshot(snapshot => {
      if (!snapshot.exists) return;
      const audioState = snapshot.data() || {};
      applySharedMusic(audioState.musicPath || '');

      const eventId = audioState.sfxEventId || null;
      if (eventId && eventId !== lastSharedSfxEventId) {
        // Do not replay an old stored effect when a page first opens. A newly
        // sent effect is still accepted if it arrives with the first snapshot.
        const isRecent = Date.now() - Number(audioState.sfxSentAt || 0) < 5000;
        if (sharedAudioSnapshotSeen || isRecent) applySharedSfx(audioState.sfxPath);
        lastSharedSfxEventId = eventId;
      }
      sharedAudioSnapshotSeen = true;
    }, error => console.error('Failed to receive shared audio:', error));

    document.addEventListener('pointerdown', () => {
      if (pendingMusicPath) applySharedMusic(pendingMusicPath);
    }, { passive: true });



    // FIREBASE ACTION HANDLER

    // Load monsters from Firebase on page load
    const monstersRef = db.collection("shared").doc("monsters");

    let lastSyncedAt = 0;

    monstersRef.onSnapshot(doc => {
      if (!doc.exists) {
        console.log("No monsters found in Firebase.");
        return;
      }

      const data = doc.data();
      if (!Array.isArray(data.monsters)) return;

      // Only update if Firebase data is newer
      if (data.updatedAt < lastSyncedAt) return;

      lastSyncedAt = data.updatedAt;

      // Store previous HP for comparison
      const previousHP = {};
      monsters.forEach(m => previousHP[m.id] = m.hp);

      // Animate deaths before rebuilding the layer; defeated monster tokens are
      // omitted below, so their old DOM position is only available right now.
      data.monsters.forEach(incoming => {
        const oldHP = previousHP[incoming.id];
        if (typeof oldHP === 'number' && oldHP > 0 && Number(incoming.hp) <= 0) {
          showTokenDeathEffect(incoming.id, false);
        }
      });

      // Clear local array *in-place*
      monsters.length = 0;

      // Clear existing tokens
      document.getElementById('mapTokenLayer').innerHTML = '';

      // Rebuild state and tokens
      data.monsters.forEach(m => {
        const normalized=normalizeMonsterState(m);
        if(normalized.hp<=0&&!normalized.isplayer)return;
        monsters.push(normalized);
        addMonsterToken(normalized);

        // Compare HP for animation
        const oldHP = previousHP[normalized.id];
        if (typeof oldHP === 'number') {
          if (normalized.hp > oldHP) flashToken(normalized.id, 'heal');
          else if (normalized.hp < oldHP) flashToken(normalized.id, 'damage');
        }

      });

      scheduleMapLayoutRefresh();
      // Update token labels with index
      monsters.forEach((m, i) => {
        const token = document.getElementById(`token-${m.id}`);
        if (token) {
          const label = token.querySelector('.token-label');
          if (label) label.textContent = i;
        }
      });
      updatePlayerTokenInitiativeLabels();
      refreshMapTokenSelection();
      renderPartyTracker();

    });

    const mapRef = db.collection("shared").doc("map");
    const drawingToolbarManager = setupSharedMapDrawing({
      db,
      mapImage,
      compact: true,
      startCollapsed: true,
      mapTransformLayer: document.getElementById('mapTransformLayer'),
      tokenLayer: document.getElementById('mapTokenLayer'),
      toolbarPosition: {
        top: '80px',
        left: '25px'
      }
    });
    let drawingToolbarHidden = false;
    document.getElementById('toggleDrawingToolbar')?.addEventListener('click', event => {
      drawingToolbarHidden = !drawingToolbarHidden;
      drawingToolbarManager.setVisible(!drawingToolbarHidden);
      event.currentTarget.textContent = drawingToolbarHidden ? 'Show Drawing' : 'Hide Drawing';
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      drawingToolbarManager.setTool('pan');
      clearMapTokenSelection();
    });

    mapImage.addEventListener('load', () => {
      applySharedMapScale();
      scheduleMapLayoutRefresh();
    });

    window.addEventListener('resize', () => {
      scheduleMapLayoutRefresh();
    });

    if (typeof ResizeObserver === 'function') {
      const mapResizeObserver = new ResizeObserver(() => {
        refreshMapLayout();
      });
      mapResizeObserver.observe(mapImage);
    }

    scheduleMapLayoutRefresh();

    mapRef.onSnapshot(doc => {
      if (!doc.exists) return;
      const sharedMap = doc.data() || {};
      const sharedScale = Number(sharedMap.mapScale);
      if (Number.isFinite(sharedScale)) {
        sharedMapScale = Math.min(Math.max(0.2, sharedScale), 3);
        applySharedMapScale();
      }
      if (sharedMap.filepath) {
        mapImage.src = sharedMap.filepath;
        scheduleMapLayoutRefresh();
      }
    });



  </script>
  <script type="module" src="dice-roller-3d.js?v=4"></script>
